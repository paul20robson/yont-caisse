const GAS_CODE="// YONT Caisse — sauvegarde en ligne ET synchronisation entre téléphones\n// À coller dans script.google.com (remplace l'ancien code), puis Déployer → Gérer les déploiements → Modifier → Nouvelle version.\nconst CLE = \"CHANGEZ-CETTE-CLE\";             // même clé que dans l'application\nconst DOSSIER = \"Sauvegardes Resto Caisse\";  // dossier créé dans votre Google Drive\nconst GARDER = 90;                           // nombre de sauvegardes conservées\nconst ETAT = \"YONT_synchro_etat.json\";       // données partagées entre les téléphones\nconst JOURNAL = \"YONT_synchro_journal.json\"; // dernières modifications envoyées\nconst GARDER_JOURNAL = 400;\n\nfunction dossier_() {\n  const it = DriveApp.getFoldersByName(DOSSIER);\n  return it.hasNext() ? it.next() : DriveApp.createFolder(DOSSIER);\n}\nfunction reponse_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction fichier_(nom) {\n  const it = dossier_().getFilesByName(nom);\n  return it.hasNext() ? it.next() : null;\n}\nfunction lire_(nom, defaut) {\n  const f = fichier_(nom);\n  return f ? f.getBlob().getDataAsString() : defaut;\n}\nfunction ecrire_(nom, texte) {\n  const f = fichier_(nom);\n  if (f) f.setContent(texte); else dossier_().createFile(nom, texte, \"application/json\");\n}\nfunction version_() {\n  return Number(PropertiesService.getScriptProperties().getProperty(\"version\") || 0);\n}\nfunction cle_(x) {\n  return x && typeof x === \"object\" && x.id != null ? String(x.id) : JSON.stringify(x);\n}\nfunction appliquer_(etat, ops) {\n  ops.forEach(function (op) {\n    if (op.u || op.d) {\n      const t = Array.isArray(etat[op.k]) ? etat[op.k] : [];\n      const pos = {};\n      t.forEach(function (x, i) { pos[cle_(x)] = i; });\n      const sup = {};\n      (op.d || []).forEach(function (k) { sup[k] = true; });\n      (op.u || []).forEach(function (x) {\n        const k = cle_(x);\n        if (pos[k] != null) t[pos[k]] = x; else { pos[k] = t.length; t.push(x); }\n      });\n      etat[op.k] = t.filter(function (x) { return !sup[cle_(x)]; });\n    } else if (op.del) {\n      delete etat[op.k];\n    } else {\n      etat[op.k] = op.v;\n    }\n  });\n  return etat;\n}\nfunction synchro_(d) {\n  const props = PropertiesService.getScriptProperties();\n  const verrou = LockService.getScriptLock();\n  verrou.waitLock(30000);\n  try {\n    let v = version_();\n    if (d.op === \"ver\") return { ok: true, ver: v };\n    if (d.op === \"init\") {\n      ecrire_(ETAT, d.data);\n      ecrire_(JOURNAL, \"[]\");\n      v = v + 1;\n      props.setProperty(\"version\", String(v));\n      props.setProperty(\"depart\", String(v));\n      return { ok: true, ver: v };\n    }\n    if (d.op === \"pull\") {\n      const depuis = Number(d.since || 0);\n      if (!v) return { ok: false, erreur: \"Aucun espace partagé : créez-le d'abord depuis le téléphone principal\" };\n      if (depuis === v) return { ok: true, ver: v, batches: [] };\n      const journal = JSON.parse(lire_(JOURNAL, \"[]\"));\n      const depart = Number(props.getProperty(\"depart\") || v);\n      if (depuis >= depart && depuis < v && journal.length && journal[0].v <= depuis + 1) {\n        return { ok: true, ver: v, batches: journal.filter(function (b) { return b.v > depuis; }).map(function (b) { return b.ops; }) };\n      }\n      return { ok: true, ver: v, full: lire_(ETAT, \"{}\") };\n    }\n    if (d.op === \"push\") {\n      if (!v) return { ok: false, erreur: \"Aucun espace partagé\" };\n      if (Number(d.base) !== v) return { ok: false, stale: true, ver: v };\n      const etat = appliquer_(JSON.parse(lire_(ETAT, \"{}\")), d.ops || []);\n      ecrire_(ETAT, JSON.stringify(etat));\n      v = v + 1;\n      const journal = JSON.parse(lire_(JOURNAL, \"[]\"));\n      journal.push({ v: v, ops: d.ops || [], dev: d.dev || \"\", ts: Date.now() });\n      ecrire_(JOURNAL, JSON.stringify(journal.slice(-GARDER_JOURNAL)));\n      props.setProperty(\"version\", String(v));\n      return { ok: true, ver: v };\n    }\n    return { ok: false, erreur: \"Opération inconnue\" };\n  } finally {\n    verrou.releaseLock();\n  }\n}\nfunction doPost(e) {\n  try {\n    const d = JSON.parse(e.postData.contents);\n    if (d.cle !== CLE) return reponse_({ ok: false, erreur: \"Clé incorrecte\" });\n    if (d.op) return reponse_(synchro_(d));\n    const dir = dossier_();\n    const nom = (d.nom || \"Sauvegarde\") + \"_\" + Utilities.formatDate(new Date(), \"Africa/Douala\", \"yyyy-MM-dd_HH'h'mm\") + \".json\";\n    dir.createFile(nom, d.data, \"application/json\");\n    const f = [], it = dir.getFiles();\n    while (it.hasNext()) { const x = it.next(); if (x.getName().indexOf(\"YONT_synchro_\") !== 0) f.push(x); }\n    f.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); });\n    f.slice(GARDER).forEach(function (x) { x.setTrashed(true); });\n    return reponse_({ ok: true, fichier: nom, total: Math.min(f.length, GARDER) });\n  } catch (err) {\n    return reponse_({ ok: false, erreur: String(err) });\n  }\n}\nfunction doGet(e) {\n  if (!e.parameter || e.parameter.cle !== CLE) return reponse_({ ok: false, erreur: \"Clé incorrecte\" });\n  const f = [], it = dossier_().getFiles();\n  while (it.hasNext()) { const x = it.next(); if (x.getName().indexOf(\"YONT_synchro_\") !== 0) f.push(x); }\n  f.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); });\n  if (e.parameter.liste) return reponse_({ ok: true, fichiers: f.slice(0, 30).map(function (x) { return { nom: x.getName(), date: x.getDateCreated() }; }) });\n  if (!f.length) return reponse_({ ok: false, erreur: \"Aucune sauvegarde\" });\n  return reponse_({ ok: true, fichier: f[0].getName(), data: f[0].getBlob().getDataAsString() });\n}\n";

/* ---------- SAUVEGARDE AUTOMATIQUE SUR MEGA ---------- */
const MEGA_DIR="Sauvegardes Resto Caisse";
const megaCfg=()=>S.settings.mega||(S.settings.mega={email:"",pass:"",last:0,lastOk:true,msg:""});
const megaOn=()=>!!(megaCfg().email&&megaCfg().pass);
function megaLib(){if(window.mega&&window.mega.Storage)return Promise.resolve(window.mega);
  const load=src=>new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src=src;sc.onload=()=>window.mega&&window.mega.Storage?ok(window.mega):ko(new Error("module MEGA illisible"));sc.onerror=()=>ko(new Error("network: module MEGA non chargé"));document.head.appendChild(sc)});
  const CDN="https://cdn.jsdelivr.net/npm/megajs@1.3.10/dist/main.browser-umd.js";
  /* l'application installée embarque le module MEGA (mega.js) : plus besoin d'un site extérieur */
  return megaLib.p||(megaLib.p=(/^https?:/.test(location.protocol)?load("mega.js").catch(()=>load(CDN)):load(CDN)).catch(e=>{megaLib.p=null;throw e}))}
async function megaLogin(){const c=megaCfg();const M=await megaLib();const st=new M.Storage({email:c.email,password:c.pass,userAgent:"RestoCaisse/1.0"});await st.ready;return st}
const megaErr=e=>{const t=String(e&&e.message||e);return /ENOENT|-9|EACCESS|-11|ESID|password|incorrect|-16|EBLOCKED/i.test(t)?"e-mail ou mot de passe MEGA incorrect (ou compte avec double authentification)":/fetch|network|internet|Failed|NetworkError|Load failed/i.test(t)?netMsg("MEGA"):t.slice(0,120)};
const netMsg=w=>!STANDALONE?`l'application Claude bloque la connexion à ${w}. Ouvrez YONT_Caisse.html dans Chrome (ou l'application installée) pour sauvegarder`:navigator.onLine===false?"pas de connexion internet":`${w} ne répond pas (connexion faible, données mobiles coupées ou site bloqué par le réseau). Réessayez dans quelques minutes`;
async function megaSend(why,silent){if(!megaOn()){if(!silent)toast("Renseignez d'abord l'e-mail et le mot de passe MEGA");return false}if(megaSend.busy)return false;megaSend.busy=true;const c=megaCfg();if(!silent)toast("Envoi de la sauvegarde vers MEGA…");let ok=false,msg="";
  try{const st=await megaLogin();let dir=(st.root.children||[]).find(n=>n.directory&&n.name===MEGA_DIR);if(!dir)dir=await st.mkdir(MEGA_DIR);
    const t=new Date();const name=`${(S.settings.name||"Resto").replace(/[^\wÀ-ſ-]+/g,"_")}_${t.toISOString().slice(0,10)}_${String(t.getHours()).padStart(2,"0")}h${String(t.getMinutes()).padStart(2,"0")}.json`;
    const data=new TextEncoder().encode(backupJSON());await dir.upload({name,size:data.length},data).complete;
    const files=(dir.children||[]).filter(n=>!n.directory).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));for(const f of files.slice(90)){try{await f.delete(true)}catch(_){}}
    try{st.close()}catch(_){}ok=true;msg=name}catch(e){ok=false;msg=megaErr(e)}
  megaSend.busy=false;c.lastTry=Date.now();c.lastOk=ok;c.msg=msg;if(ok){c.last=Date.now();S.settings.lastBackup=Date.now();log(`Sauvegarde MEGA (${why}) : ${msg}`)}save();
  if(!silent||!ok)toast(ok?"Sauvegarde envoyée sur MEGA":"Sauvegarde MEGA impossible : "+msg);if(ui.view==="profil")render();return ok}
async function megaRestore(){if(!megaOn())return;toast("Recherche de la dernière sauvegarde sur MEGA…");
  try{const st=await megaLogin();const dir=(st.root.children||[]).find(n=>n.directory&&n.name===MEGA_DIR);const f=dir&&(dir.children||[]).filter(n=>!n.directory).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))[0];if(!f)throw new Error("aucune sauvegarde sur MEGA");
    const buf=await f.downloadBuffer();const D=JSON.parse(new TextDecoder().decode(buf));if(!D.products||!D.sales)throw new Error("fichier invalide");
    if(!confirm(`Remplacer toutes les données de cet appareil par la sauvegarde MEGA « ${f.name} » (${D.sales.length} factures) ?`))return;
    const keep=JSON.parse(JSON.stringify(megaCfg())),kc=S.settings.cloud?JSON.parse(JSON.stringify(S.settings.cloud)):null;S=D;migrate();S.settings.mega=keep;if(kc)S.settings.cloud=kc;save();ui.session=false;render();lockScreen();toast("Données restaurées depuis MEGA")}
  catch(e){toast("Restauration MEGA impossible : "+megaErr(e))}}
function autoCloud(why){if(cloudOn())cloudSend(why,true);if(megaOn())setTimeout(()=>megaSend(why,true),1500)}
setInterval(()=>{if(megaOn()&&navigator.onLine!==false&&Date.now()-(+megaCfg().last||0)>20*36e5&&Date.now()-(+megaCfg().lastTry||0)>30*6e4)megaSend("automatique",true)},5*6e4+7000);

async function vaultForgot(){const code=($("#fgC").value||"").trim().toUpperCase().replace(/[\s-]/g,"").replace(/^(.{4})(.{4})(.{4})$/,"$1-$2-$3");const e=(VLT.env.keys||[]).find(k=>k.login==="#secours");

function doForgot(){if(ui.vaultLocked)return vaultForgot();const id=($("#fgU").value||"").trim().toLowerCase(),code=($("#fgC").value||"").trim().toUpperCase().replace(/\s/g,""),a=$("#fgP").value,b=$("#fgP2").value;
  if((ui.lockWait||0)>Date.now()){toast("Trop d'essais : patientez");return}
  const u=S.staff.find(x=>(x.login||"").toLowerCase()===id&&["Gérant","Développeur"].includes(roleKey(x.role)));
  const fmtCode=code.replace(/-/g,"").replace(/^(.{4})(.{4})(.{4})$/,"$1-$2-$3");
  if(!u||!S.settings.recovery||!pwOk(S.settings.recovery,RECU,fmtCode)){ui.fails=(ui.fails||0)+1;if(ui.fails>=5){ui.lockWait=Date.now()+60000;ui.fails=0}toast("Identifiant de gérant ou code de secours incorrect");return}
  if(a!==b){toast("Les deux mots de passe ne sont pas identiques");return}if(weakPw(a,u)){toast("Mot de passe trop simple : au moins 6 caractères");return}
  u.pw=pwHash(u,a);delete u.pwTemp;delete u.pin;ui.fails=0;vaultRemember(u.login,a);ui.lastLogin=u.login;log(`Mot de passe du gérant réinitialisé avec le code de secours : ${u.name}`);save();lockScreen();toast("Mot de passe changé : connectez-vous. Pensez à créer un nouveau code de secours.")}

    ["Fond de départ",fmt(c.fond)],["+ Ventes espèces",fmt(c.cashSales)],["+ Crédits réglés",fmt(c.settle)],["− Remboursements",fmt(c.refundCash)],["− Dépenses espèces",fmt(c.expCash)],...(c.formation?[["+ Frais de formation",fmt(c.formation)]]:[]),

function printLines(title,lines){
  const W=+S.settings.ticketW||80;
  if(STANDALONE){
    const body=lines.map(l=>l[0]==="sep"?"<hr>":l[0]==="center"?`<div class="c" style="${l[2]?"font-weight:bold":""}">${esc(l[1])}</div>`:`<div class="l" style="${l[2]?"font-weight:bold":""}"><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`).join("");
    const css=`@page{size:${W}mm auto;margin:0}body{width:${W-6}mm;margin:2mm 3mm;font:${W>60?12:10}px Arial,sans-serif;color:#000}.c{text-align:center}hr{border:0;border-top:1px dashed #000;margin:5px 0}.l{display:flex;justify-content:space-between;gap:6px}`;
    printDoc(title,css,body,null);return;
  }
  if(!window.jspdf){toast("Module d'impression non chargé");return}
  const {jsPDF}=window.jspdf;const M=3,R=W-M,c=W/2;const doc=new jsPDF({unit:"mm",format:[W,16+lines.length*4.4]});let y=7;doc.setFontSize(8);
  lines.forEach(l=>{if(l[0]==="sep"){doc.setLineDashPattern([0.8,0.8],0);doc.line(M,y-1.5,R,y-1.5);y+=3;return}
    doc.setFont("helvetica",l[2]?"bold":"normal");if(l[0]==="center"){doc.splitTextToSize(l[1],W-2*M).forEach(t=>{doc.text(t,c,y,{align:"center"});y+=4})}else{doc.text(l[0],M,y);doc.text(l[1],R,y,{align:"right"});y+=4}});
  saveFile(title.replace(/\W+/g,"_")+".pdf",doc.output("arraybuffer")).then(()=>toast("Rapport prêt : ouvrez le PDF pour l'imprimer")).catch(saveErr);
}

  const c={id:uid(),no:S.closures.length+1,by:S.user,user:X.uid,...C,cashCounted:v("clCash"),omCounted:v("clOM"),mmCounted:v("clMM"),fondLeft:v("clFL"),note:($("#clN")?.value||"").trim()};

function invCount(p){const d=(S.invDraft||{})[p.id];if(!d||(d.cs===""||d.cs===undefined)&&(d.u===""||d.u===undefined))return null;return (p.pack?(+d.cs||0)*p.pack:0)+(+d.u||0)}

    s.items.forEach(i=>{cost+=i.qty*i.cost;const k=i.name;byP[k]=byP[k]||{q:0,ca:0,cost:0};byP[k].q+=i.qty;byP[k].ca+=i.qty*i.price;byP[k].cost+=i.qty*i.cost;byP[k].ht=(byP[k].ht||0)+i.qty*i.price-tvaS(s,i.qty*i.price)})});

    ${top.length?`<div class="barlist">${top.map(([k,v],i)=>`<div class="b"><div><span>${i+1}. ${esc(k)} <small class="muted">× ${v.q}</small></span><b class="num">${fmt(v.m)}</b></div><div class="track"><span style="width:${Math.max(v.m,0)/mx*100}%"></span></div></div>`).join("")}</div>`
      :`<div class="empty">${ic("box")}<br>Aucune donnée de vente.<br><small>Les produits vendus apparaîtront ici.</small></div>`}
  </div>
  ${detailVentes(P)}
  ${detailDepenses(P)}`;
}
const FAM={boisson:"Boissons",repas:"Repas",kit:"Kits"};
function salesByProduct(P){
  const g={boisson:{},repas:{},kit:{}};
  P.sales.forEach(s=>s.items.forEach(i=>{const p=prod(i.pid);const t=p&&g[p.type]?p.type:"boisson";
    const o=g[t][i.name]=g[t][i.name]||{q:0,ca:0,co:0,pack:p&&p.pack,pn:p&&p.packName,n:0};o.q+=i.qty;o.ca+=i.qty*i.price;o.co+=i.qty*i.cost;o.n++;o.ht=(o.ht||0)+i.qty*i.price-tvaS(s,i.qty*i.price)}));
  return g;
}
const plw=(n,w)=>`${n.toLocaleString("fr-FR",{maximumFractionDigits:1})} ${w}${n>1&&!/s$/.test(w)?"s":""}`;
const packTxt=o=>o.pack&&o.q>=o.pack?`<div class="dmeta">${plw(Math.floor(o.q/o.pack),esc(o.pn||"casier"))}${o.q%o.pack?" + "+o.q%o.pack:""}</div>`:"";
function detailVentes(P){
  const g=salesByProduct(P);const fams=Object.keys(g).filter(k=>Object.keys(g[k]).length&&(ui.dfam==="all"||ui.dfam===k));
  const q=(ui.dq||"").trim().toLowerCase();
  let T={q:0,ca:0,co:0,ht:0};
  const rows=fams.map(f=>{const items=Object.entries(g[f]).filter(([k])=>!q||k.toLowerCase().includes(q)).sort((a,b)=>b[1].q-a[1].q);if(!items.length)return"";
    const st={q:0,ca:0,co:0,ht:0};items.forEach(([,o])=>{st.q+=o.q;st.ca+=o.ca;st.co+=o.co;st.ht+=o.ht});T.q+=st.q;T.ca+=st.ca;T.co+=st.co;T.ht+=st.ht;
    return `<tr class="fam"><td colspan="6"><b>${FAM[f]}</b></td></tr>`+items.map(([k,o])=>{const ht=o.ht;return `<tr><td class="wrap">${esc(k)}${packTxt(o)}</td><td class="r num"><b>${o.q}</b></td><td class="r num hm">${fmt(o.ca/o.q)}</td><td class="r num">${fmt(o.ca)}</td><td class="r num hm">${fmt(o.co)}</td><td class="r num"><b>${fmt(ht-o.co)}</b></td></tr>`}).join("")
      +`<tr class="dsub"><td class="wrap">Sous-total ${FAM[f].toLowerCase()}</td><td class="r num">${st.q}</td><td class="hm"></td><td class="r num">${fmt(st.ca)}</td><td class="r num hm">${fmt(st.co)}</td><td class="r num">${fmt(st.ht-st.co)}</td></tr>`}).join("");
  return `<div class="panel" id="detailVentes"><div class="row" style="justify-content:space-between;margin-bottom:10px">${plHead("cart","var(--gold-soft)","var(--gold)",`<span>Détail des ventes<br><small class="muted" style="font-weight:500">Ce qui a réellement été vendu, par quantité</small></span>`)}<span class="pill info">${P.sales.length} facture(s)</span></div>
    <div class="row" style="margin-bottom:10px"><input id="dQ" type="search" placeholder="Rechercher un produit" value="${esc(ui.dq||"")}" style="max-width:260px">
      <div class="chipsbar">${[["all","Tout"],["boisson","Boissons"],["repas","Repas"],["kit","Kits"]].map(([k,l])=>`<button data-dfam="${k}" aria-pressed="${ui.dfam===k}">${l}</button>`).join("")}</div></div>
    ${rows?`<div class="scroll"><table class="det"><thead><tr><th>Produit</th><th class="r">Qté</th><th class="r hm">Prix moyen</th><th class="r">Montant TTC</th><th class="r hm">Coût d'achat</th><th class="r">Marge</th></tr></thead><tbody>${rows}
      <tr class="dtot"><td>TOTAL</td><td class="r num">${T.q}</td><td class="hm"></td><td class="r num">${fmt(T.ca)}</td><td class="r num hm">${fmt(T.co)}</td><td class="r num">${fmt(T.ht-T.co)}</td></tr></tbody></table></div>`
      :`<div class="empty">Aucune vente sur cette période.</div>`}
    <p class="muted" style="margin:8px 0 0;font-size:.8rem">Factures annulées exclues. Les kits sont comptés comme un article ; leurs composants sortent du stock.</p></div>`;
}
function detailDepenses(P){
  const byC={};P.exp.forEach(e=>(byC[e.cat]=byC[e.cat]||[]).push(e));const cats=Object.entries(byC).sort((a,b)=>b[1].reduce((x,e)=>x+e.amount,0)-a[1].reduce((x,e)=>x+e.amount,0));
  const ins=S.moves.filter(m=>m.type==="in"&&m.ts>=rangeOf(ui.rp).from&&m.ts<=rangeOf(ui.rp).to&&prod(m.pid)?.type==="boisson").sort((a,b)=>b.ts-a.ts);
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px">${plHead("bill","var(--bad-soft)","var(--bad)",`<span>Détail des dépenses<br><small class="muted" style="font-weight:500">Dépenses d'exploitation et achats de boissons</small></span>`)}<b class="num" style="color:var(--gold)">${fmt(P.dep+P.achats)}</b></div>
    ${cats.length||ins.length?`<div class="scroll"><table class="det"><thead><tr><th>Date</th><th>Libellé</th><th class="r">Montant</th></tr></thead><tbody>
      ${cats.map(([c,list])=>`<tr class="fam"><td colspan="3"><b>${esc(c)}</b></td></tr>`+list.map(e=>`<tr><td class="num">${new Date(e.ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</td><td class="wrap">${esc(e.label)}<div class="dmeta">${esc(e.pay)} · ${esc(staffName(e.by))}</div></td><td class="r num">${fmt(e.amount)}</td></tr>`).join("")
        +`<tr class="dsub"><td colspan="2">Sous-total</td><td class="r num">${fmt(list.reduce((a,e)=>a+e.amount,0))}</td></tr>`).join("")}
      ${ins.length?`<tr class="fam"><td colspan="3"><b>Achats de boissons (entrées en stock)</b></td></tr>`+ins.map(m=>{const p=prod(m.pid);return `<tr><td class="num">${new Date(m.ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</td><td class="wrap">${esc(p?.name||"—")} · ${m.qty}${p&&p.pack?` (${plw(m.qty/p.pack,esc(p.packName||"casier"))})`:""}<div class="dmeta">${m.note?esc(m.note)+" · ":""}${esc(staffName(m.by))}</div></td><td class="r num">${fmt(m.qty*moveCost(m))}</td></tr>`}).join("")
        +`<tr class="dsub"><td colspan="2">Sous-total</td><td class="r num">${fmt(P.achats)}</td></tr>`:""}
      <tr class="dtot"><td colspan="2">TOTAL DES SORTIES</td><td class="r num">${fmt(P.dep+P.achats)}</td></tr></tbody></table></div>`
      :`<div class="empty">Aucune dépense ni achat sur cette période.</div>`}</div>`;
}

/* ---------- HISTORIQUES ---------- */
function vHistoriques(){
  if(ui.hist==="audit")return vAudit();
  const ev=[];
  if(ui.hist!=="stock"&&ui.hist!=="log")S.sales.forEach(s=>ev.push({ts:s.ts,k:"Vente",pill:"ok",t:`Facture n° ${s.no||"—"} · ${s.items.reduce((a,i)=>a+i.qty,0)} article(s) · ${s.pay}`,v:fmt(s.total),by:servedNames(s)}));
  if(ui.hist!=="vente"&&ui.hist!=="log")S.moves.forEach(m=>ev.push({ts:m.ts,k:m.type==="in"?"Entrée":m.type==="out"?"Perte":m.type==="retour"?"Retour (avoir)":"Inventaire",pill:m.type==="out"?"bad":"info",t:`${prod(m.pid)?.name||"—"}${m.note?" · "+m.note:""}`,v:(m.type==="out"?"−":m.type==="in"?"+":"= ")+(+m.qty||0),by:staffName(m.by)}));
  if(ui.hist==="log")S.log.filter(l=>!hidDev(S.staff.find(u=>u.id===l.by))).forEach(l=>ev.push({ts:l.ts,k:"Modification",pill:"warn",t:l.txt,v:"",by:staffName(l.by)}));
  if(ui.hist==="all")S.log.filter(l=>!/^Facture/.test(l.txt)&&!hidDev(S.staff.find(u=>u.id===l.by))).forEach(l=>ev.push({ts:l.ts,k:"Action",pill:"warn",t:l.txt,v:"",by:staffName(l.by)}));
  ev.sort((a,b)=>b.ts-a.ts);
  return `${page("Historiques","Toutes les ventes, mouvements de stock et modifications.",XLb())}
  ${histChips()}
  <div class="panel"><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Détail</th><th>Par</th><th class="r">Valeur</th></tr></thead><tbody>
  ${ev.slice(0,ui.hist==="log"?1000:200).map(e=>`<tr><td class="num">${dt(e.ts)}</td><td><span class="pill ${e.pill}">${e.k}</span></td><td>${esc(e.t)}</td><td>${esc(e.by)}</td><td class="r num">${e.v}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Rien pour l'instant.</td></tr>`}
  </tbody></table></div></div>`;
}

const GUIDE=[
 ["Menus réservés et espace développeur","utilisateurs",["Utilisateurs → Accès aux menus : pour chaque menu, choisissez « Gérant et développeur seulement ». Les caissiers, serveurs et cuisiniers ne le voient plus.","Le rôle Développeur a tous les droits du gérant, plus le menu « Outils développeur » (contrôle des données, mots de passe de tous les comptes, journal technique).","Le premier compte Développeur peut être créé par le gérant. Ensuite, seul un développeur peut créer, modifier ou retirer un compte Développeur.","Un développeur peut réserver un menu au développeur seulement : il disparaît alors aussi pour le gérant."]],
 ["Mot de passe oublié","accueil",["Employé : le gérant ouvre Utilisateurs, tape un mot de passe provisoire sur la ligne de l'employé et touche « Donner ». L'employé se connecte avec et choisit aussitôt son nouveau mot de passe.","Gérant : sur l'écran de connexion, touchez « Mot de passe oublié ? », tapez votre identifiant, le code de secours noté sur papier et votre nouveau mot de passe.","Le code de secours se crée (ou se renouvelle) dans Paramètres → Sécurité. Gardez-le hors du téléphone.","Sans code de secours : restaurez une sauvegarde faite quand vous connaissiez votre mot de passe."]],
 ["Centre de formation : un espace séparé","formation",["Le gérant passe d'un espace à l'autre avec les boutons « Restaurant » et « Centre de formation » en haut du menu.","Le centre a son propre menu : apprenants, encaissements, caisse et clôture, dépenses, emploi du temps, présences, notes, stages, TP, formateurs et rapports.","Créez les comptes du centre dans Utilisateurs avec les rôles Directeur du centre, Secrétaire du centre ou Formateur : ils ne voient pas le restaurant.","Les frais des apprenants et les dépenses du centre ne passent plus par la caisse ni la rentabilité du restaurant. La Vue société additionne les deux."]],
 ["Centre : filières, promotions et inscriptions","fprog",["Filières et promotions : créez chaque filière (inscription, formation, annexes, frais d'examen, nombre de tranches), puis ses promotions (dates, budget).","Apprenants → Inscrire : identité, photo, tuteur, contact d'urgence, filière et promotion. Une remise ou bourse demande un motif.","L'échéancier est calculé tout seul. Encaissez depuis la fiche : le reçu PDF part par WhatsApp.","Depuis la fiche : carte d'apprenant, bulletin et attestation en PDF. Cartes de toute une promotion : Filières et promotions → Cartes PDF."]],
 ["Centre : emploi du temps, appel et notes","cfp_peda",["Emploi du temps → Ajouter une séance (promotion, horaires, module, formateur), avec répétition chaque semaine.","Après le cours, touchez « Marquer faite » : les heures comptent pour les vacations du formateur.","Présences : choisissez la séance, marquez Absent ou Retard. Le bouton WhatsApp prévient le parent.","Notes et bulletins : créez une évaluation (module, sur combien, coefficient) puis saisissez les notes. Moyennes, rangs et bulletins PDF sont calculés."]],
 ["Centre : dépenses, formateurs et caisse","cfp_dep",["Dépenses du centre : saisissez les charges propres au centre et, si possible, la promotion concernée pour connaître le coût par apprenant.","Formateurs et vacations : indiquez le taux horaire. Le montant dû = heures des séances faites × taux. « Payer les vacations » crée la dépense.","Caisse du centre : espèces attendues = fond + frais encaissés − dépenses payées en espèces. Comptez puis clôturez.","Rapports du centre : résultat, recouvrement, résultat par filière et par promotion, effectifs, export Excel."]],
 ["Centre : prospects, échéances et documents","formation",["Prospects et inscriptions : notez chaque personne intéressée, sa source et une date de rappel. « Inscrire » ouvre la fiche déjà remplie.","Une promotion avec un nombre de places refuse les inscriptions quand elle est complète : mettez la personne en « Liste d'attente ».","Encaissements → À venir : prévenez par WhatsApp avant l'échéance. Prévisions : ce qui doit rentrer mois par mois.","Fiche apprenant : fiche d'inscription, certificat de scolarité, relevé de compte, suivi et discipline, échéancier modifiable, pénalité, remboursement, kit."]],
 ["Centre : programme, examens, insertion","cfp_peda",["Filières → Programme : un module par ligne avec ses heures (« Hygiène ; 30 »). L'emploi du temps montre l'avancement de chaque promotion.","Chaque séance a son cahier de texte : ce qui a été vu et le travail à faire.","Présences → Pointer avec les cartes : la caméra lit le QR code des cartes d'apprenant (Chrome sur Android), ou tapez le matricule.","Examens : créez l'examen pour une promotion, cochez les dossiers complets, saisissez les résultats et enregistrez le reversement des frais.","Insertion et partenaires : situation des diplômés, taux d'insertion, entreprises qui accueillent des stagiaires."]],
 ["Synchronisation entre téléphones","admin",["Paramètres → Serveur en ligne : le lien Supabase est déjà rempli ; tapez la clé secrète, Enregistrer, puis Tester la connexion.","Sur le téléphone qui a les bonnes données : Paramètres → Synchronisation → « Créer l'espace partagé ».","Sur chaque autre téléphone (application installée) : même lien, même clé, puis « Rejoindre l'espace partagé ». Ses anciennes données sont remplacées.","Ensuite tout se fait seul : chaque saisie arrive sur les autres téléphones en quelques secondes avec internet. Hors ligne, on continue : tout part au retour du réseau.","Les mots de passe sont communs à tous les téléphones. Deux factures faites hors ligne avec le même numéro sont renumérotées automatiquement."]],
 ["Données protégées (chiffrement)","admin",["Paramètres → Sécurité → « Protéger les données de ce téléphone », puis votre mot de passe.","Notez le nouveau code de secours sur papier : c'est la seule issue si tous les mots de passe sont oubliés.","Après un redémarrage, l'écran affiche 🔒 : la connexion ouvre les données. Un employé qui ne s'est jamais connecté sur ce téléphone doit le faire une fois quand l'application est déjà ouverte (Changer d'utilisateur).","Les sauvegardes restent lisibles pour pouvoir les restaurer : gardez-les en lieu sûr."]],
 ["Repas de TP des apprenants","offert",["Dans Nouvelle vente (restaurant), ajoutez les plats préparés en TP puis touchez « Repas de TP ».","Choisissez la promotion, le formateur et le thème, puis encaissez à 0 F : le stock baisse et le coût matière est compté pour le centre, pas pour le restaurant.","Si le restaurant reprend des plats de TP pour les vendre, enregistrez une cession dans Travaux pratiques : recette pour le centre, charge pour le restaurant."]],
 ["Impôts : IGS","admin",["« Impôts (IGS) » : chiffre d'affaires de l'année, projection, IGS annuel et acompte de chaque trimestre.","Indiquez le chiffre d'affaires déclaré de l'année précédente : c'est la base officielle des acomptes.","« Enregistrer le paiement » à chaque acompte (avant le 15 du mois qui suit le trimestre) : il passe en dépense et sort de la caisse.","La jauge du seuil prévient quand le chiffre d'affaires approche 50 millions (passage au régime du réel)."]],
 ["Clôturer une période","admin",["« Comptabilité » → Clôture de période : choisissez le mois et touchez « Clôturer ».","Dépenses, achats, paie, encaissements de formation et paiements d'impôts datés avant ne peuvent plus être saisis ni supprimés.","« Rouvrir » est réservé au gérant et reste noté dans l'historique."]],
 ["Diviser une addition, vendre au verre","encaisser",["Dans le ticket, « Diviser l'addition » : montant par personne, ou articles séparés sur un ticket à encaisser tout de suite.","Au verre : « Gérer mes prix » → « Au verre » sur la bouteille (whisky, vin…) : nombre de verres et prix du verre. Chaque verre vendu retire la fraction de bouteille du stock.","Plafond de crédit : « Clients » → Modifier → plafond. Au-delà, seul le gérant peut vendre à crédit."]],
 ["Commande reçue par WhatsApp (menu QR)","vente",["Le client a scanné le QR de sa table et vous a envoyé sa commande sur WhatsApp.","Dans WhatsApp, appuyez longuement sur le message, puis Copier.","Nouvelle vente → Commande WhatsApp → collez le message → Ajouter au ticket.","Les articles s'ajoutent à la table indiquée dans le message. Vérifiez le ticket, envoyez en cuisine et servez ; le client paie à la fin comme d'habitude."]],
 ["Menu QR pour les clients","admin",["Menu QR clients → vérifiez le numéro WhatsApp qui reçoit les commandes.","Télécharger le menu : le fichier index.html reprend vos plats, boissons, photos et prix.","Mettez-le en ligne une seule fois sur app.netlify.com/drop (compte gratuit) et collez l'adresse obtenue dans les réglages.","Télécharger les QR codes (PDF) : un chevalet par table, à imprimer et plastifier.","Après un changement de prix ou de carte : recréez le menu et glissez-le à nouveau dans Netlify (onglet Deploys). Les QR codes restent valables."]],
 ["Démarrer","accueil",["Sur l'écran de connexion, tapez votre identifiant (ex. paul) et votre mot de passe.","À la première connexion, ou avec un mot de passe provisoire donné par le gérant, l'application vous demande de choisir votre mot de passe personnel (6 caractères au moins).","Le menu s'ouvre avec le bouton ☰ en haut à gauche. Vous ne voyez que les rubriques de votre profil.","En partant, touchez « Changer d'utilisateur » en bas du menu.","L'application se verrouille seule après quelques minutes sans activité."]],
 ["Prendre une commande","vente",["Ouvrez « Nouvelle vente » et touchez la table (Table, Comptoir ou À emporter).","Touchez chaque article : un toucher = une unité. Pour en ajouter plusieurs d'un coup, choisissez d'abord la quantité (2, 3, 6, 12, 24 ou « Autre »), puis touchez l'article.","Dans le ticket, touchez la quantité pour la taper directement, ou utilisez + et −.","Le chiffre sous chaque article est le stock restant.","Serveur : touchez « Envoyer à la caisse ». Pour une nouvelle tournée, retouchez la même table."]],
 ["Encaisser une vente","encaisser",["Touchez la table : la commande envoyée apparaît dans le ticket.","Vérifiez « Servi par » et « Client ».","Cochez « Facture avec TVA 19,25 % » seulement si le client veut une facture avec TVA (la case n'apparaît que si le régime du réel est choisi dans Paramètres).","Choisissez Espèces, Orange Money, MTN MoMo, Crédit client ou Paiement mixte. En espèces, saisissez la somme reçue : la monnaie s'affiche.","Touchez « Encaisser » : la facture s'affiche, prête à imprimer."]],
 ["Remise, offert et paiement mixte","remise",["« Remise » : en F ou en %, sur tout le ticket ; le motif est obligatoire et s'imprime sur la facture.","L'icône cadeau à côté d'un article : il est offert, le stock baisse mais pas le chiffre d'affaires.","« Paiement mixte » : répartissez le total entre plusieurs moyens (ex. 3 000 F espèces + 3 300 F Orange Money)."]],
 ["Imprimer ou renvoyer une facture","factures",["Après l'encaissement : « Imprimer le ticket » (imprimante de caisse), « Facture A4 » (imprimante de bureau) ou « Enregistrer le ticket en PDF » (WhatsApp, e-mail).","Plus tard : « État des factures » → « Voir » sur la facture, puis le bouton d'impression."]],
 ["Annuler une facture par avoir","annuler",["Une facture n'est jamais effacée.","« État des factures » → « Annuler » → choisissez le motif et écrivez la précision.","Un avoir numéroté (A000001…) est créé, le stock est remis, la facture passe en « Annulé » et sort du chiffre d'affaires."]],
 ["Ventes à crédit et clients","credit",["Choisissez le client, puis le paiement « Crédit client » : la facture reste « En attente ».","« Clients » → « Modifier » : corrigez le nom, le téléphone, l'adresse ou le NIU d'un client.","Quand il paie : « État des factures » → « Encaisser », ou « Clients » → « Tout encaisser ».","Nouveau client : « Clients » → nom et téléphone → « Ajouter »."]],
 ["Dépenses","depenses",["« Dépenses » → bouton + → libellé, catégorie, montant, mode de paiement.","Saisissez chaque sortie d'argent le jour même : glace, charbon, transport, marché…"]],
 ["Livraisons, pertes et casse","stocks",["« Gérer mes stocks » → « Mouvement de stock ».","Les entrées de marchandise se font uniquement par « Fournisseurs & achats » → « Nouvelle réception ».","Pour une sortie (« Perte / casse ») ou une régularisation (« Régularisation »), indiquez la quantité et le motif obligatoire, puis « Enregistrer »."]],
 ["Consignes d'emballages","consignes",["« Consignes emballages » → « Nouvelle consigne client » : nom et téléphone du client, emballage, casiers et/ou bouteilles à l'unité.","La caution se calcule seule avec la consigne du casier et de la bouteille ; indiquez le mode de paiement et la date de retour prévue.","« Enregistrer la consigne » : le bon de consigne numéroté s'imprime pour le client.","Au retour : « Suivi des consignes » → « Retour » → casiers et bouteilles rendus ; le remboursement de la caution se calcule. Un retour partiel laisse le reste en cours.","Si le client ne rend pas : cochez « Le reste ne sera pas rendu » pour garder la caution.","Les filtres En cours, En retard, Soldées et la recherche suivent chaque client ; « Emballages par client » montre qui détient quoi.","« Emballages disponibles » : pleins en stock, chez les clients, vides disponibles, et l'écart avec les vides comptés."]],
 ["Clôturer la caisse","cloture",["Chaque caissier a sa propre caisse : les ventes, dépenses et cautions qu'il encaisse sont à son nom.","« Clôture de caisse » : comptez billets et pièces ligne par ligne. La première fois, indiquez votre fond de caisse.","Saisissez les soldes Orange Money et MTN MoMo lus sur les téléphones.","Indiquez le fond laissé pour le prochain service et un commentaire en cas d'écart.","« Clôturer la caisse et imprimer le rapport Z », puis remettez le rapport et l'argent au gérant.","Un écart négatif = argent manquant : recomptez avant de clôturer.","Gérant : « Caisses en cours » montre l'argent attendu chez chaque caissier ; « Voir » ouvre sa caisse pour la clôturer. Le mode « caisse unique » se choisit dans Paramètres."]],
 ["Écran cuisine et bons de cuisine","cuisine",["Dès que le serveur envoie la commande (ou que la caisse encaisse), les plats partent en cuisine sur un bon numéroté. Seuls les plats ajoutés depuis le dernier envoi sont envoyés.","« Écran cuisine » : « Commencer », puis « Prêt » quand le plat est prêt. Un bon de plus de 20 minutes passe en rouge.","Les plats prêts s'affichent en haut de « Nouvelle vente » : le serveur touche « Servi ».","« Imprimer » sort le bon pour la cuisine ; l'impression automatique se règle dans Paramètres."]],
 ["Relances par WhatsApp","factures",["Sur chaque facture : « Envoyer par WhatsApp » prépare le message avec le détail et le total.","Facture à crédit ou page Clients : « Relancer » prépare le rappel du solde dû.","Consignes : « Rappel WhatsApp » rappelle les emballages à rapporter et la caution.","WhatsApp s'ouvre avec le message déjà écrit : vérifiez, puis envoyez. Enregistrez le téléphone du client pour qu'il soit choisi automatiquement."]],
 ["Gestion des repas","repas",["« Gestion des repas » → nom, catégorie, prix, coût de revient, portions disponibles → « Ajouter le repas ».","Chaque matin, « + Portions » : choisissez +5, +10, +20… ou tapez le nombre exact de portions préparées."]],
 ["Photos de la carte","produits",["« Photos de la carte » : touchez « Ajouter une photo » sous la boisson, le plat ou le kit.","Sur téléphone, vous pouvez photographier directement le plat ou la bouteille.","Dans « Gestion des repas », touchez aussi la petite vignette 📷 à gauche du plat.","Les photos apparaissent dans « Nouvelle vente ». Une photo de marque (catalogue) sert pour tous ses formats tant qu'un produit n'a pas sa propre photo."]],
 ["Boissons, prix, kits et promotions","produits",["« Choisir mes boissons » : cochez les marques vendues au restaurant.","« Création de boisson » : une boisson absente du catalogue.","« Gérer mes prix » : tous les prix d'un coup, avec la marge.","« Kits & Promotions » : un kit à prix unique ou un prix réduit temporaire."]],
 ["Achats fournisseurs","achats",["« Fournisseurs & achats » → « Nouveau fournisseur » (une seule fois).","« Nouvelle réception » : fournisseur, date, n° de facture, une ligne par produit.","Cochez la TVA déductible si la facture du fournisseur la porte ; indiquez ce qui est payé, le reste devient une dette.","« Enregistrer la réception » : le stock augmente seul. « Commande suggérée » dit combien commander."]],
 ["Faire l'inventaire","inventaire",["Avant de compter : « Imprimer la fiche de comptage » pour noter les quantités sur papier.","Comptez ce qui est réellement présent, après la fermeture.","« Inventaire » → saisissez chaque quantité dans « Compté » : l'écart et sa valeur s'affichent.","« Valider l'inventaire » : cochez qui a compté, choisissez qui a contrôlé, puis validez ; le stock est corrigé.","« Imprimer pour signature » : la feuille A4 datée porte les cases de signature (compté par, contrôlé par, gérant) et la mention d'archivage.","Dans l'historique, chaque inventaire indique qui l'a compté, contrôlé et validé, avec le bouton « Imprimer ». À faire au moins une fois par semaine."]],
 ["Compte d'exploitation","admin",["« Rentabilités » → « Bénéfice » : le compte d'exploitation présente les soldes intermédiaires de gestion SYSCOHADA : marge commerciale, valeur ajoutée, EBE, résultat d'exploitation et résultat net, avec le % du chiffre d'affaires.","Chaque poste se détaille par nature de dépense : saisissez donc chaque dépense dans la bonne nature (énergie, loyer, salaires, impôts…).","Les pertes, la casse et les écarts d'inventaire des boissons diminuent la marge commerciale.","L'export Excel reprend le compte d'exploitation complet et le compte comptable de chaque dépense."]],
 ["Rapports et rentabilité","rapports",["« Rapports » : chiffre d'affaires, modes de paiement, ventes par serveur.","« Rentabilités » (gérant) : compte d'exploitation, détail des articles vendus par quantité, dépenses, bénéfice.","Chaque page a un sélecteur de période et un bouton « Exporter en Excel »."]],
 ["Comptabilité et TVA","admin",["« Comptabilité & TVA » → période « Mois ».","État de TVA : TVA facturée (4431) − TVA récupérable (4452) = TVA à reverser.","« Exporter les écritures (Excel) » : feuilles Écritures, Balance et État TVA pour le cabinet comptable."]],
 ["Activer la TVA","admin",["« Paramètres » → Fiscalité → Régime fiscal : choisissez « Régime du réel ». À l'IGS, la TVA n'est pas applicable.","Facultatif : « Cocher la TVA par défaut à chaque nouvelle vente » ; sinon le caissier choisit vente par vente.","Touchez « Enregistrer »."]],
 ["Personnel et paie","admin",["« Personnel et paie » → « Nouvel employé » (ou « Créer les fiches depuis les utilisateurs ») : identité, poste, CNPS, NIU, contrat, salaire de base et indemnités.","Chaque mois, onglet « Paie du mois » : choisissez le mois, puis « Variables » pour les heures supplémentaires, primes, absences et avances.","« Bulletin » imprime le bulletin A4 de l'employé ; « Imprimer tous les bulletins » sort toute la paie, avec les cases de signature.","« Valider la paie » passe la paie en comptabilité (brut, retenues dues, charges patronales) et verrouille les variables ; puis « Enregistrer le versement des salaires » sort le net de la caisse.","Les paiements à la CNPS et aux impôts se saisissent en Dépenses avec les natures « Paiement CNPS » et « Paiement des impôts sur salaires ».","Onglet « Paramètres » : taux CNPS, IRPP, CAC, CFC, FNE, RAV et TDL, modifiables. Vérifiez-les avant la première paie."]],
 ["Utilisateurs et droits","admin",["« Utilisateurs » → nom, rôle, code à 4 chiffres → « Ajouter ».","Changer un code : « Nouveau code » sur la ligne → « Changer ». « Retirer » pour un employé parti.","« Droits par rôle » : cochez ou décochez chaque action ; « Revenir aux droits conseillés » remet l'origine.","« Verrouillage » : délai avant verrouillage automatique."]],
 ["Sauvegarde, chaque soir","admin",["« Paramètres » → « Télécharger la sauvegarde » : un fichier daté arrive dans Téléchargements.","Copiez-le sur une clé USB ou envoyez-le-vous par WhatsApp ou e-mail.","Après une panne ou sur un autre ordinateur : « Restaurer une sauvegarde » → « Remplacer les données ».","« Tout réinitialiser » efface tout : seulement après une sauvegarde."]],
 ["Installer l'application","accueil",["Ouvrez l'adresse internet de l'application dans Chrome (Android, ordinateur) ou Safari (iPhone).","Android et ordinateur : menu ☰ → « Installer l'application », ou menu ⋮ de Chrome → « Installer l'application ».","iPhone : bouton Partager → « Sur l'écran d'accueil ».","L'icône apparaît comme une vraie application, s'ouvre en plein écran et fonctionne sans internet. Les données restent sur l'appareil : faites la sauvegarde chaque soir."]],
 ["En cas de problème","accueil",["Code oublié : le gérant le change dans « Utilisateurs ».","Rubrique absente du menu : votre profil n'y a pas droit, demandez au gérant.","Le ticket ne s'imprime pas : vérifiez l'imprimante dans la fenêtre d'impression, sinon enregistrez le PDF.","Erreur après encaissement : le gérant annule par avoir, puis refaites la vente.","Stock faux : faites un inventaire.","Données disparues : rouvrez le fichier au même endroit et dans le même navigateur, sinon restaurez la sauvegarde."]]
];
function vAide(){
  const ok=k=>k==="accueil"||(["vente","cuisine","fprog","formation"].includes(k)?canView(k):can(k));
  const list=GUIDE.filter(g=>ok(g[1]));
  return `${page("Guide d'utilisation",`Les fiches utiles au profil ${esc(me()?.role||"")}. Touchez une fiche pour l'ouvrir.`)}
  <div style="display:grid;gap:10px">${list.map((g,i)=>`<details class="panel guide" ${i===0?"open":""}><summary style="cursor:pointer;font-weight:700">${esc(g[0])}</summary><ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:6px">${g[2].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`).join("")}</div>`;
}

/* ---------- PROFIL / UTILISATEURS / CLIENTS ---------- */
function vProfil(){const st=S.settings;const chk=(id,on,label)=>`<label class="f full" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="${id}" ${on?"checked":""}> ${label}</label>`;
  const sec=(ico,t,sub)=>`<div class="row" style="gap:10px;align-items:center;margin-bottom:10px;flex-wrap:nowrap"><span class="ib" style="background:var(--accent-soft);color:var(--accent);flex:none">${ic(ico)}</span><div><h3 style="margin:0">${t}</h3>${sub?`<small class="muted">${sub}</small>`:""}</div></div>`;
  const reel=st.regime==="reel";
  return `${page("Paramètres","Tous les réglages de l'établissement, de la caisse et de la sécurité.")}
  <form id="setForm" style="display:grid;gap:14px">
  <div class="panel">${sec("shop","Établissement","Ces informations apparaissent sur les tickets, factures et bulletins de paie")}<div class="form">
    <div class="f full"><span>Logos (affichés côte à côte)</span><div class="row" style="gap:16px;align-items:flex-start">${[["logo","stLogo","Logo YONT","LOGO_DEF"],["logo2","stLogo2","Logo Sainte Anastasie","LOGO2_DEF"]].map(([k,id,l])=>`<div style="display:grid;gap:6px;justify-items:start">${S.settings[k]?`<img src="${S.settings[k]}" alt="${l}" style="width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px">`:`<span class="muted" style="width:72px;height:72px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:12px">Aucun</span>`}<span class="btn sm" style="position:relative;overflow:hidden">${S.settings[k]?"Changer":"Ajouter"}<input type="file" accept="image/*" id="${id}" aria-label="${l}" style="position:absolute;inset:0;opacity:0;cursor:pointer"></span>${S.settings[k]?`<button type="button" class="btn sm ghost" data-logo-del="${k}">Retirer</button>`:`<button type="button" class="btn sm ghost" data-logo-def="${k}">${l}</button>`}</div>`).join("")}</div><small class="muted">Ils s'affichent sur l'écran de connexion, le menu, les tickets, les factures A4 et les reçus.</small></div>
    <label class="f full">Raison sociale / nom de l'établissement<input id="stN" value="${esc(st.name)}"></label>
    <label class="f full">Nom court (en haut de l'écran)<input id="stSh" value="${esc(st.short||"")}" placeholder="${esc(shortName())}" maxlength="22"></label>
    <label class="f">Ville / quartier<input id="stC" value="${esc(st.city)}"></label>
    <label class="f">Téléphone<input id="stP" value="${esc(st.phone)}" placeholder="6 XX XX XX XX"></label>
    <label class="f">NIU (numéro contribuable)<input id="stNiu" value="${esc(st.niu)}" placeholder="M0XXXXXXXXXXXX"></label>
    <label class="f">RCCM<input id="stR" value="${esc(st.rccm)}" placeholder="RC/DLA/20XX/B/XXXX"></label>
    <label class="f full">Message en bas de facture<input id="stF" value="${esc(st.footer)}"></label></div></div>
  <div class="panel">${sec("bill","Fiscalité","Régime d'imposition et TVA")}<div class="form">
    <label class="f full">Régime fiscal<select id="stRg"><option value="igs" ${!reel?"selected":""}>Impôt Général Synthétique (IGS) : TVA non applicable</option><option value="reel" ${reel?"selected":""}>Régime du réel : TVA 19,25 % (17,5 % + CAC)</option></select></label>
    <label class="f">Centre des impôts<input id="stCdi" value="${esc(st.cdi||"")}" placeholder="Ex. CDI Lebialem"></label>
    ${chk("stVD",st.tvaDefault,"Régime du réel : cocher la TVA par défaut à chaque vente (sinon, au choix du caissier)")}
    <p class="muted full" style="margin:0">${reel?"La case « Facture avec TVA 19,25 % » apparaît à la vente ; la TVA collectée et la TVA déductible passent en comptabilité.":"Aucune TVA n'est facturée ni comptabilisée ; les tickets affichent « TOTAL » sans mention TTC."}</p></div></div>
  <div class="panel">${sec("cart","Caisse et ventes")}<div class="form">
    <label class="f">Nombre de tables<input id="stT" type="number" min="1" max="40" value="${S.tables}"></label>
    <label class="f">PDF envoyé aux clients<select id="stPS"><option value="a4" ${(st.pdfShare||"a4")==="a4"?"selected":""}>Facture A4</option><option value="ticket" ${st.pdfShare==="ticket"?"selected":""}>Ticket de caisse</option></select></label>
    <label class="f full">Imprimante des tickets sur cet appareil<select id="stPM"><option value="systeme" ${pMode()!=="rawbt"?"selected":""}>Fenêtre d'impression du téléphone ou de l'ordinateur</option><option value="rawbt" ${pMode()==="rawbt"?"selected":""}>Imprimante Bluetooth via l'application RawBT (Android)</option></select></label>
    <label class="f">Le bouton Imprimer imprime<select id="stPF"><option value="ticket" ${(st.printFmt||"ticket")==="ticket"?"selected":""}>Le ticket de caisse</option><option value="a4" ${st.printFmt==="a4"?"selected":""}>La facture A4</option></select></label>
    <label class="f">Largeur du ticket<select id="stW"><option value="80" ${+st.ticketW===80?"selected":""}>80 mm</option><option value="58" ${+st.ticketW===58?"selected":""}>58 mm</option></select></label>
    <label class="f full">Mode de caisse<select id="stCM"><option value="caissier" ${st.cashMode!=="unique"?"selected":""}>Une caisse par caissier (chacun clôture la sienne)</option><option value="unique" ${st.cashMode==="unique"?"selected":""}>Une caisse unique pour tout le personnel</option></select></label>
    ${chk("stAP",st.autoPrint,STANDALONE?"Imprimer le ticket automatiquement après chaque vente":"Préparer le ticket PDF automatiquement après chaque vente")}
    ${chk("stKP",st.kitchenPrint,"Imprimer le bon de cuisine automatiquement")}
    <label class="f">Moment de l'impression du bon<select id="stKW"><option value="servi" ${(st.kPrintAt||"servi")==="servi"?"selected":""}>Quand la serveuse touche « Servi » (Écran cuisine)</option><option value="envoi" ${st.kPrintAt==="envoi"?"selected":""}>Dès que la commande est envoyée</option></select></label>
    <label class="f">Appareil relié à l'imprimante<select id="stKD"><option value="">Celui qui touche le bouton</option>${devList().map(d=>`<option value="${esc(d.id)}" ${st.kPrintDev===d.id?"selected":""}>${esc(d.name)}</option>`).join("")}</select></label>
    <label class="f full">Coût des repas dans le bénéfice<select id="stM"><option value="portion" ${st.mealCost!=="depenses"?"selected":""}>Coût de revient par portion (conseillé)</option><option value="depenses" ${st.mealCost==="depenses"?"selected":""}>Achats du marché saisis en dépenses</option></select></label></div></div>
  <div class="setsave"><button class="btn primary" style="width:100%;padding:12px">Enregistrer les paramètres</button></div>
  </form>
  <div class="panel">${sec("users","Sécurité","Codes personnels et accès")}<div class="form">
    <label class="f">Verrouillage automatique après<select id="stAL">${[[0,"Jamais"],[5,"5 minutes"],[15,"15 minutes"],[30,"30 minutes"],[60,"1 heure"]].map(([v,l])=>`<option value="${v}" ${+st.autoLock===v?"selected":""}>${l}</option>`).join("")}</select></label>
    <div class="f"><span>Utilisateurs</span><button type="button" class="btn" data-go="utilisateurs">Utilisateurs, mots de passe et droits</button></div>
    ${vaultPanelHtml()}<div class="f full"><span>Code de secours du gérant</span><div class="row" style="gap:8px;align-items:center"><button type="button" class="btn" data-recovery-new>${S.settings.recovery?"Créer un nouveau code de secours":"Créer le code de secours"}</button><small class="muted">${S.settings.recovery?"Créé le "+new Date(S.settings.recoveryTs||0).toLocaleDateString("fr-FR")+". Un nouveau code annule l'ancien.":"Aucun code : si le gérant oublie son mot de passe, l'accès sera bloqué."}</small></div></div></div>
    <p class="muted" style="margin:8px 0 0">${visStaff().filter(u=>!u.pw||u.pwTemp).length?`${visStaff().filter(u=>!u.pw||u.pwTemp).length} utilisateur(s) n'ont pas encore leur mot de passe personnel.`:"Tous les utilisateurs ont leur mot de passe personnel."}</p></div>
  <div class="panel">${sec("report","Autres réglages")}<div class="setlinks">
    <button class="btn ghost" data-go-ptab="param">Paie : taux CNPS, IRPP, CAC, CFC, FNE, RAV, TDL</button>
    <button class="btn ghost" data-go="menuqr">Menu QR clients : numéro WhatsApp et adresse</button>
    <button class="btn ghost" data-go="consignes">Consignes : valeur des casiers et bouteilles</button>
    <button class="btn ghost" data-go="compta">Comptabilité : plan de comptes</button></div></div>
  <div class="panel"><h3 style="display:flex;gap:10px;align-items:center"><span class="ib" style="background:var(--accent-soft);color:var(--accent)">${ic("safe")}</span>Sauvegarde automatique sur MEGA</h3>
    <p class="muted" style="margin:0 0 10px">Les données partent toutes seules dans votre compte MEGA, chiffrées : une fois par jour, à chaque clôture de caisse et à la demande. Elles vont dans le dossier « ${MEGA_DIR} » ; les 90 dernières sauvegardes sont gardées.</p>
    ${megaOn()?`<div class="notice ${megaCfg().lastOk===false?"gold":""}">${ic(megaCfg().lastOk===false?"alert":"info")}<span>${megaCfg().last?`Dernière sauvegarde MEGA : <b>${new Date(megaCfg().last).toLocaleString("fr-FR")}</b>`:"Aucune sauvegarde MEGA pour l'instant."}${megaCfg().lastOk===false?` · dernier essai échoué : ${esc(megaCfg().msg||"")}`:""}</span></div>`:""}
    ${!STANDALONE?`<div class="notice gold" style="margin-top:10px">${ic("info")}<span>Dans l'application Claude, la connexion à MEGA est bloquée. Enregistrez vos identifiants ici si vous voulez, mais la sauvegarde ne fonctionnera que dans <b>Chrome</b> (fichier YONT_Caisse.html) ou dans l'application installée.</span></div>`:""}<form id="megaForm" class="form" style="margin-top:10px"><label class="f">E-mail du compte MEGA<input id="mgE" type="email" value="${esc(megaCfg().email)}" autocomplete="off" placeholder="sauvegarde.yont@…"></label>
      <label class="f">Mot de passe MEGA<input id="mgP" type="password" value="${megaCfg().pass?"••••••••":""}" autocomplete="new-password" placeholder="Mot de passe"></label>
      <div class="row full" style="gap:8px"><button class="btn primary">Enregistrer</button>${megaOn()?`<button type="button" class="btn" data-mega-now>Sauvegarder maintenant</button><button type="button" class="btn ghost" data-mega-restore>Restaurer depuis MEGA</button><button type="button" class="btn ghost" data-mega-off>Désactiver</button>`:""}</div></form>
    <p class="muted" style="margin:8px 0 0">Conseil : créez un compte MEGA gratuit réservé aux sauvegardes (20 Go offerts), sans double authentification. Son mot de passe est enregistré sur cet appareil pour l'envoi automatique : ne l'utilisez pour rien d'autre. Internet est nécessaire ; fonctionne dans Chrome ou l'application installée.</p></div>
  <div class="panel"><h3 style="display:flex;gap:10px;align-items:center"><span class="ib" style="background:var(--accent-soft);color:var(--accent)">${ic("safe")}</span>Serveur en ligne : sauvegarde et partage (Supabase)</h3>
    <p class="muted" style="margin:0 0 10px">Votre serveur YONT (Supabase) : les données y partent toutes seules (une fois par jour, à chaque clôture de caisse et à la demande, 30 sauvegardes gardées) et c'est par lui que les téléphones se partagent les ventes. Il suffit de taper la clé secrète puis Enregistrer : aucun script à installer.</p>
    ${cloudOn()?`<div class="notice ${cloud().lastOk===false?"gold":""}">${ic(cloud().lastOk===false?"alert":"info")}<span>${cloud().last?`Dernière sauvegarde en ligne : <b>${new Date(cloud().last).toLocaleString("fr-FR")}</b>`:"Aucune sauvegarde en ligne pour l'instant."}${cloud().lastOk===false?` · dernier essai échoué : ${esc(cloud().msg||"")}`:""}</span></div>`:""}
    <form id="cloudForm" class="form" style="margin-top:10px"><label class="f full">Lien du serveur (Supabase, ou script Google se terminant par /exec)<input id="clU" value="${esc(cloud().url||YONT_SUPA)}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"></label>
      <div class="f full" style="margin-top:-4px"><span></span><span class="row" style="gap:6px;flex-wrap:wrap"><button type="button" class="btn sm" data-use-supa>Utiliser le serveur YONT (Supabase)</button><small class="muted">${isSupa(cloud().url)?"Serveur actuel : Supabase":cloud().url?"Serveur actuel : script Google":""}</small></span></div>
      <label class="f">Clé secrète<input id="clK" value="${esc(cloud().cle)}" placeholder="La même que dans le script"></label>
      <div class="row full" style="gap:8px"><button class="btn primary">Enregistrer</button><button type="button" class="btn" data-cloud-test>Tester la connexion</button>${cloudOn()?`<button type="button" class="btn" data-cloud-now>Sauvegarder maintenant</button><button type="button" class="btn ghost" data-cloud-restore>Restaurer (choisir la date)</button>`:""}</div></form>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;color:var(--muted)">Ancien serveur Google (facultatif, inutile avec Supabase)</summary>
      <ol style="padding-left:20px;display:grid;gap:6px;margin:10px 0">
        <li>Sur un ordinateur, connectez-vous au compte Google de l'établissement et ouvrez <b>script.google.com</b> → <b>Nouveau projet</b>. (Déjà installé ? Ouvrez votre projet, remplacez tout le code par le nouveau, puis Déployer → Gérer les déploiements → crayon → Nouvelle version → Déployer : le lien reste le même.)</li>
        <li>Effacez le contenu, puis collez le code ci-dessous (bouton « Copier le code »). Remplacez <b>CHANGEZ-CETTE-CLE</b> par un mot secret.</li>
        <li><b>Déployer</b> → <b>Nouveau déploiement</b> → type <b>Application Web</b> · Exécuter en tant que : <b>Moi</b> · Qui a accès : <b>Tout le monde</b> → <b>Déployer</b>, puis autorisez l'accès à votre Drive.</li>
