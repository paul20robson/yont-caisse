<style>
/* Layout : barre du haut + tiroir de menu (fixe à gauche sur grand écran), contenu en une colonne pensé pour le téléphone */
:root{
  /* Monde visuel « Comptoir » : sol ivoire de cahier de caisse, vert bouteille pour la coque et la sélection,
     rouge piment réservé à l'action d'encaisser. Une seule famille (Archivo), titres en largeur condensée.
     Geste signature : le ticket de caisse (bande thermique dentelée) qui suit le serveur, y compris en barre collante sur téléphone. */
  --bg:#F4F1EA; --surface:#FFFDF9; --sunk:#EAE5DA; --line:#DAD3C4; --line-2:#C9C0AE;
  --ink:#1C211D; --muted:#585E57; --accent:#17462F; --accent-2:#0F3323; --accent-ink:#FFFFFF; --accent-soft:#DDEBE1;
  --shell:#0F3323; --shell-ink:#F4F1EA; --shell-line:rgba(244,241,234,.16);
  --gold:#B8441A; --gold-ink:#FFFFFF; --gold-soft:#FAE8DD;
  --ok:#1D6B3F; --ok-soft:#DCEFE2; --warn:#8A5200; --warn-soft:#FAEBCD; --bad:#A3241C; --bad-soft:#F7DEDA;
  --t-violet:#6E3F8F; --t-violet-soft:#EFE5F4; --t-green:#1D6B3F; --t-green-soft:#DCEFE2; --t-blue:#245C9E; --t-blue-soft:#E1EBF6;
  --paper:#FFFEFA; --shadow:0 1px 2px rgba(28,33,29,.06),0 6px 18px -8px rgba(28,33,29,.18);
  --n-blonde:#D9A52B;--n-brune:#6B3A1E;--n-soda:#E2622B;--n-jus:#E8B32E;--n-eau:#3D8FD1;--n-malt:#9A5B2E;--n-energie:#C7362E;--n-premix:#7A4FB5;--n-spirit:#9A5B1E;--n-vin:#8E1B3A;--n-champ:#B8962E;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Archivo",system-ui,sans-serif;
  --f-ticket:ui-monospace,"SFMono-Regular","Cascadia Mono","Courier New",monospace;
  --r:12px; --side:280px; --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#182019; --sunk:#0B0F0C; --line:#2A342D; --line-2:#3A463E;
  --ink:#E8EBE5; --muted:#A2ACA3; --accent:#8FD1A8; --accent-2:#0F3323; --accent-ink:#0B1A11; --accent-soft:#1A3326;
  --shell:#0C2419; --shell-ink:#E8EBE5; --shell-line:rgba(232,235,229,.14);
  --gold:#F08A5D; --gold-ink:#24100A; --gold-soft:#3A2116;
  --ok:#6FD39A; --ok-soft:#163323; --warn:#F2B04C; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1A18;
  --t-violet:#C9A2E6; --t-violet-soft:#2E1E36; --t-green:#6FD39A; --t-green-soft:#173326; --t-blue:#8DB6EE; --t-blue-soft:#18263C;
  --paper:#F7F4EC; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#182019; --sunk:#0B0F0C; --line:#2A342D; --line-2:#3A463E;
  --ink:#E8EBE5; --muted:#A2ACA3; --accent:#8FD1A8; --accent-2:#0F3323; --accent-ink:#0B1A11; --accent-soft:#1A3326;
  --shell:#0C2419; --shell-ink:#E8EBE5; --shell-line:rgba(232,235,229,.14);
  --gold:#F08A5D; --gold-ink:#24100A; --gold-soft:#3A2116;
  --ok:#6FD39A; --ok-soft:#163323; --warn:#F2B04C; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3D1A18;
  --t-violet:#C9A2E6; --t-violet-soft:#2E1E36; --t-green:#6FD39A; --t-green-soft:#173326; --t-blue:#8DB6EE; --t-blue-soft:#18263C;
  --paper:#F7F4EC; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--shell);color:var(--shell-ink);border-bottom:1px solid var(--shell-line);
  display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top button{background:transparent;border:0;color:inherit;padding:6px;border-radius:8px;display:grid;place-items:center;position:relative}
.top .t{display:grid;line-height:1.15;min-width:0}
.top .t b{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:.85rem;opacity:.85}
.top .bell{margin-left:auto}
.badge{position:absolute;top:0;right:0;background:var(--gold);color:var(--gold-ink);font-size:.65rem;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.5);z-index:15}
.drawer{position:fixed;inset:0 auto 0 0;width:min(var(--side),86vw);z-index:16;background:var(--surface);display:flex;flex-direction:column;
  border-radius:0 22px 22px 0;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.drawer.open{transform:none}
.dhead{background:var(--shell);border-bottom:1px solid var(--shell-line);color:var(--shell-ink);padding:26px 18px 22px;display:grid;justify-items:center;gap:10px;text-align:center;border-radius:0 22px 0 0}
.logo{width:64px;height:64px;border-radius:50%;background:transparent;border:3px solid var(--gold);color:var(--gold);display:grid;place-items:center}
.logo svg{width:34px;height:34px}
.logo.img{background:#fff;overflow:hidden;padding:3px}.logo.img img{width:100%;height:100%;object-fit:contain;border-radius:50%}.logo.img.big{width:96px;height:96px}
.rlogo{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 6px}
.dhead b{font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:.02em;line-height:1.1}
.dhead small{opacity:.85}
.dnav{overflow-y:auto;padding:8px 12px 14px;flex:1}
.spsw{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:10px 12px 0;background:var(--sunk);border-radius:12px;padding:4px}.spsw button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:700;font-size:.82rem;color:var(--ink);display:flex;gap:5px;align-items:center;justify-content:center}.spsw button .ic{width:16px;height:16px}.spsw button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.dsec{font-family:var(--f-display);font-size:1rem;font-weight:600;color:var(--muted);padding:16px 8px 4px}
.dlink{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:1px solid transparent;border-radius:12px;padding:7px 8px;text-align:left;font-size:.97rem}
.dlink .ib{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dlink .chev{margin-left:auto;color:var(--muted);width:16px;height:16px}
.dlink:hover{background:var(--sunk)}
.dlink[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
.dlink.hot{background:var(--gold-soft);border-color:var(--gold);font-weight:700}
.dlink.hot .ib{background:var(--gold);color:var(--gold-ink)}
.dver{margin:10px 12px 12px;text-align:center;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px}
@media (min-width:1000px){
  .drawer{transform:none;box-shadow:none;border-right:1px solid var(--line);border-radius:0}
  .dhead{border-radius:0}
  .scrim,.top .menuBtn{display:none!important}
  .top,main{margin-left:var(--side)}
}

main{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.85rem;line-height:1.05;letter-spacing:.005em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.15;margin:0 0 10px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.muted{color:var(--muted);font-size:.86rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gold{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
[data-checkout].btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.01em}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=checkbox]{width:18px;height:18px}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.form .full{grid-column:1/-1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.notice svg{color:var(--accent);margin-top:1px}
.notice.gold{background:var(--gold-soft)}
.chipsbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;min-width:0}
.ih{min-width:0;flex-wrap:wrap}

   Couche de design « Comptoir » — refonte Impeccable (oct. 2026)
   Elle se pose au-dessus des règles d'origine : classes, IDs et JS inchangés.

[hidden]:not([hidden=until-found i]){display:none!important}
#updBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:10px;align-items:center;background:var(--shell);color:var(--shell-ink);padding:12px 14px;border-radius:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45);max-width:560px;margin:0 auto}#updBar>span{flex:1;line-height:1.3}#updBar .btn.ghost{color:inherit;border-color:transparent;font-size:1.2rem}
.flash{animation:flash 1.6s var(--ease,ease)}@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
#qrBox{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:55;max-width:460px;margin-left:auto;background:var(--surface);color:var(--ink);border:2px solid var(--gold);border-radius:16px;box-shadow:0 16px 40px -12px rgba(0,0,0,.45);max-height:60vh;overflow:auto;animation:upIn .32s cubic-bezier(.16,1,.3,1)}
#qrBox .qrh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--gold-soft);position:sticky;top:0}
#qrBox .qri{display:grid;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.top .syncDot{display:flex;gap:6px;align-items:center;grid-auto-flow:column;padding:4px 10px;border-radius:999px;border:1px solid var(--shell-line);font-size:.72rem;font-weight:700;white-space:nowrap}
.top .syncDot[hidden]{display:none}
.syncDot i{width:9px;height:9px;border-radius:50%;background:#6FD39A;flex:none}
.syncDot.wait i{background:#F2B04C;animation:pulse 1s infinite}.syncDot.off i{background:#9AA59D}.syncDot.err i{background:#FF8A80}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:420px){.syncDot b{display:none}.top .syncDot{padding:6px}}
/* menu latéral fermé (téléphone) : plus d'ombre ni de bord qui dépasse sur le côté gauche */
@media (max-width:999.98px){.drawer:not(.open){box-shadow:none!important;visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}.drawer.open{visibility:visible;transition:transform .22s ease}}
.btn:active:not(:disabled){transform:translateY(1px) scale(.97)}
#updBar{animation:upIn .32s cubic-bezier(.16,1,.3,1)}@keyframes upIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.kpi,.fitem,.panel{transition:box-shadow .2s ease,transform .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html{-webkit-tap-highlight-color:transparent;scrollbar-color:var(--line-2) transparent}
body{letter-spacing:-.003em}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent);color:inherit}
input,select,textarea{caret-color:var(--gold);accent-color:var(--accent)}
a{text-underline-offset:.18em}
svg.ic.sm{width:16px;height:16px;vertical-align:-3px}
h2,h3,.cname,.kpi .v,.tot .big,.top .t b,.dhead b,.slide h4,.tbl b,.lockin h2,.seg button,.tbar .tb-t,.qchips button{font-stretch:80%}

/* Coque : barre du haut et tiroir */
.top{padding-block:8px;gap:8px;box-shadow:0 1px 0 var(--shell-line)}
.top button{width:44px;height:44px;padding:0;border-radius:10px;transition:background-color .15s var(--ease)}
.top button:hover{background:var(--shell-line)}
.top .t b{font-size:1.3rem;font-weight:750}
.top .t span{font-size:.8rem;opacity:.75}
.badge{top:5px;right:5px}
.drawer{border-radius:0 16px 16px 0}
.dhead{padding:20px 18px 16px;justify-items:start;text-align:left;gap:8px;border-radius:0 16px 0 0}
.dhead .logos{justify-content:flex-start}
.dhead .logo.img{width:52px;height:52px}
.dhead b{font-size:1.3rem;font-weight:750;line-height:1.05}
.dhead small{opacity:.72;font-size:.8rem}
.spsw{margin:12px 12px 0}
.spsw button{min-height:40px}
.dsec{font-family:var(--f-body);font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.dlink{min-height:44px;padding:6px 10px;gap:12px;border-radius:10px;font-size:.95rem;color:var(--ink);transition:background-color .15s var(--ease)}
.dlink .ib{width:22px;height:22px;background:none;color:var(--muted);border-radius:0}
.dlink .ib svg{width:20px;height:20px}
.dlink .chev{display:none}
.dlink[aria-current="page"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:650}
.dlink[aria-current="page"] .ib{color:var(--accent)}
.dlink.hot{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.dlink.hot .ib{background:none;color:var(--gold-ink)}
.dlink.hot:hover{background:color-mix(in srgb,var(--gold) 88%,#000)}
.drawer>.dlink{margin:0!important;width:100%!important;border-radius:0;border-top:1px solid var(--line);padding:10px 22px;min-height:58px}
.drawer>.dlink small{font-size:.78rem}
.dver{border:0;padding:4px 6px 8px;margin:0 12px 6px;font-size:.74rem}

/* Contenu */
main{padding-block:22px 72px}
.wrap{gap:18px}
h2{font-size:2.05rem;font-weight:750;letter-spacing:-.005em}
h3{font-size:1.2rem;font-weight:700}
.ph p{font-size:.92rem}
.panel{border-radius:14px;border-color:var(--line);box-shadow:var(--shadow)}
.muted{color:var(--muted)}

/* Boutons et champs */
.btn{min-height:42px;padding:9px 16px;border-radius:10px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .08s var(--ease)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:9px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,#000);border-color:transparent}
.btn.act,[data-checkout].btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:750}
.btn.act:hover:not(:disabled),[data-checkout].btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 86%,#000)}
.btn:disabled,.btn.primary:disabled,[data-checkout].btn.primary:disabled{opacity:1;background:var(--sunk);border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line));color:var(--ink)}
input,select,textarea{min-height:42px;border-radius:10px;border-color:var(--line-2);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox],input[type=radio]{min-height:0}
td input{min-height:36px}
label.f{font-size:.78rem;font-weight:650}
.chipsbar button{min-height:38px;padding:6px 14px;transition:background-color .15s var(--ease)}
.pill{font-weight:700;letter-spacing:.01em}
@media (pointer:coarse){.btn.sm,.chipsbar button,.pays button,.spsw button{min-height:44px}}

/* Bandeaux d'information : plus compacts, empilés sans pousser la page */
.notice{border-radius:12px;padding:10px 12px;font-size:.9rem;align-items:center;border:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
.notice.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 22%,transparent)}
.notice svg{margin-top:0;flex:none}
.notice .btn{flex:none}
@media (max-width:600px){.notice{flex-wrap:wrap}.notice>span{flex:1 1 200px}.notice>.btn{margin-left:auto}}

/* Accueil */
.slides{grid-auto-columns:86%;gap:12px}
@media (min-width:760px){.slides{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));overflow:visible}.slides+.dots{display:none}}
.slide{min-height:150px;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.slide h4{font-size:1.6rem;font-weight:750}
.slide p{opacity:.88}
.slide .btn{background:rgba(255,255,255,.96);color:#1C211D;border-color:transparent;min-height:40px}
.slide .btn:hover{background:#fff}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{grid-auto-flow:column;justify-content:center;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:.98rem;font-weight:700;min-height:58px;box-shadow:var(--shadow);transition:border-color .15s var(--ease)}
.tile .ib{width:auto;height:auto;background:none!important;color:var(--accent)!important}
.tile .ib svg{width:22px;height:22px}
.tile[data-go="vente"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tile[data-go="vente"] .ib{color:var(--gold-ink)!important}
.tile[data-go="vente"]:hover{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 88%,#000)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{justify-content:flex-start}}
.kpi{border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .eyebrow{font-size:.8rem;font-weight:650;color:var(--muted)}
.kpi .v{font-size:1.95rem;font-weight:750}
.kpi.hl{background:var(--shell);color:var(--shell-ink);border-color:var(--shell)}
.kpi.hl .s,.kpi.hl .eyebrow{color:var(--shell-ink);opacity:.78}
.fitem{border-radius:12px;padding:10px 12px;grid-template-columns:40px minmax(0,1fr) auto;min-height:60px;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.fitem .ib{width:40px;height:40px;border-radius:10px}
.fitem .ib svg{width:20px;height:20px}
.fitem:hover{border-color:var(--line-2);background:color-mix(in srgb,var(--sunk) 45%,var(--surface))}
.fitem .chev{width:18px;height:18px;color:var(--muted)}

/* Nouvelle vente */
.tables{gap:8px;padding:2px 2px 6px;scroll-snap-type:x proximity}
.tbl{min-width:94px;min-height:56px;border-radius:12px;padding:8px 12px;scroll-snap-align:start;transition:background-color .15s var(--ease),border-color .15s var(--ease)}

.tbl.busy{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}

.tbl[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);outline:0}

/* Geste signature : le ticket de caisse, une bande thermique dentelée, toujours claire */
.ticket{--ink:#1C211D;--muted:#585E57;--line:#DAD3C4;--line-2:#C9C0AE;--surface:#FFFEFA;--bg:#F4F1EA;--sunk:#EAE5DA;
  --accent:#17462F;--accent-ink:#FFFFFF;--accent-soft:#DDEBE1;--gold:#B8441A;--gold-ink:#FFFFFF;--gold-soft:#FAE8DD;
  background:var(--paper);color:var(--ink);border:0;border-radius:6px 6px 0 0;padding:18px 16px 20px;margin-bottom:10px;
  top:calc(env(safe-area-inset-top,0px) + 76px);overflow:visible}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:7px;
  background:conic-gradient(from 135deg at 50% 0,var(--paper) 90deg,#0000 0) 0 0/14px 7px repeat-x}
.ticket h3{font-size:1.3rem}

.ticket .lines{font-size:.9rem;max-height:44vh}

.ticket .line{border-bottom:1px dashed var(--line-2);padding:8px 0}
.ticket .line .q button{width:40px;height:40px;border-radius:10px;background:var(--surface);border-color:var(--line-2);font-size:1.1rem}
.ticket .qin{width:48px!important;height:40px;min-height:40px;border-radius:8px}
.ticket .tot{border-top:2px dashed var(--ink);font-size:.88rem}
.ticket .tot .big{font-family:var(--f-display);font-size:2rem;font-weight:800;letter-spacing:-.01em;align-items:baseline}
.ticket .pays{gap:6px}
.ticket .pays button{min-height:42px;border-radius:10px;background:var(--surface);border-color:var(--line-2);font-size:.82rem}
.ticket .pays button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ticket [data-checkout],.ticket [data-send]{min-height:56px;font-size:1.2rem!important;font-stretch:85%}
.offb{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;vertical-align:middle;filter:none;opacity:.6;color:var(--muted);border-radius:8px}
.offb.on{opacity:1;color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}

/* Barre de ticket collante (téléphone) : le total et l'accès à l'encaissement restent sous le pouce */
.tbar{display:none}
@media (max-width:860px){
  .tbar:not([hidden]){display:flex;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;align-items:center;gap:10px;width:100%;min-height:60px;
    padding:8px 8px 8px 14px;border:0;border-radius:14px;background:var(--shell);color:var(--shell-ink);text-align:left;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
  .tbar .tb-n{display:flex;align-items:center;gap:8px;font-size:.86rem;min-width:0;flex:1}
  .tbar .tb-n>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbar .tb-n svg{width:20px;height:20px;flex:none;opacity:.8}
  .tbar .tb-t{font-size:1.45rem;font-weight:800;white-space:nowrap}
  .tbar .tb-go{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:11px 14px;font-weight:750}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}

/* Factures, tableaux, modales, toast */
.fcard{border-radius:12px;border-width:1px;min-height:64px}
.fcard .fa .ico{display:inline-grid;vertical-align:-2px;margin-right:4px}
th{font-size:.76rem;letter-spacing:.02em}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 40%,transparent)}
.modal{background:rgba(12,20,15,.55)}
.modal>.panel,.modal>form.panel{box-shadow:0 30px 70px -24px rgba(0,0,0,.55);border:0}
.receipt{border-radius:6px}
.toast{width:max-content;font-size:.88rem;padding:10px 16px;border-radius:12px;max-width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow)}

/* Écran de connexion */
.lockin{gap:16px}
.lockin h2{font-size:2.2rem;border-bottom:0;padding-bottom:0;font-weight:800}
.lockin .logo{border-color:var(--gold);color:var(--gold)}
.lf input{border-radius:12px;min-height:52px;border-color:transparent}
.lf input:focus{outline:none;border-color:transparent;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 70%,transparent)}
.pwrap .eye{color:#585E57;display:grid;place-items:center;width:44px;height:44px;right:4px;padding:0}
.lock .btn.act{min-height:52px;border-radius:12px}
.lhint svg.ic{vertical-align:-3px;margin-right:4px}

(()=>{const out=[];CAT.forEach(c=>{if(!Array.isArray(c.f)||c.f.length<2){out.push(c);return}
  c.f.forEach((f,i)=>{if(!i){out.push({...c,f:[f]});return}const sl=String(f[0]).toLowerCase().replace(/[^a-z0-9]+/g,"")+"-"+f[1];out.push({...c,id:c.id+"-"+sl,f:[f],split:c.id})})});
  CAT.length=0;out.forEach(x=>CAT.push(x))})();

function startSlides(){
  const el=$("#slides");if(!el)return;
  const sync=()=>{const i=Math.round(el.scrollLeft/(el.firstElementChild.offsetWidth+12));document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i))};
  el.addEventListener("scroll",sync,{passive:true});
  clearInterval(startSlides.t);
  return; /* défilement automatique retiré : le contenu ne bouge plus tout seul */
  startSlides.t=setInterval(()=>{if(!document.body.contains(el)){clearInterval(startSlides.t);return}
    const w=el.firstElementChild.offsetWidth+12;const n=el.children.length;const i=Math.round(el.scrollLeft/w);
    el.scrollTo({left:((i+1)%n)*w,behavior:"smooth"})},5000);
}

async function setPhoto(id,file){
  if(!file)return;toast("Préparation de la photo…");
  const heic=/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name||"");
  const draw=src=>{const w=src.width,h=src.height;if(!w||!h)throw new Error("vide");const sc=Math.min(1,320/Math.max(w,h));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(src,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",.8)};
  const viaImg=()=>new Promise((ok,ko)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{ok(draw(img))}catch(e){ko(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error("illisible"))};img.src=url});
  const viaReader=()=>new Promise((ok,ko)=>{const r=new FileReader();r.onerror=()=>ko(new Error("lecture"));r.onload=()=>{const img=new Image();img.onload=()=>{try{ok(draw(img))}catch(e){ko(e)}};img.onerror=()=>ko(new Error("illisible"));img.src=r.result};r.readAsDataURL(file)});
  let data=null;
  try{if(window.createImageBitmap){const bm=await createImageBitmap(file);data=draw(bm);bm.close&&bm.close()}}catch(e){}
  if(!data)try{data=await viaImg()}catch(e){}
  if(!data)try{data=await viaReader()}catch(e){}
  if(!data){toast(heic?"Photo iPhone (HEIC) non lisible : faites une capture d'écran de la photo, puis ajoutez la capture":"Ce fichier n'est pas une image lisible (choisissez une photo JPG ou PNG)");return}
  S.photos[id]=data;save();render();toast("Photo enregistrée");
}

function payCalc(e,k){
  const c=PC(),v=(S.payroll[k]||{})[e.id]||{hs:0,prime:0,abs:0,avance:0,retenue:0};const r=x=>Math.round(+x||0);
  const base=r(e.base),absD=Math.max(0,+v.abs||0),absAmt=Math.round(base/30*absD);
  const anc=e.embauche?Math.max(0,Math.floor((new Date(k+"-28")-new Date(e.embauche))/(365.25*864e5))):0;
  const ancAmt=e.anciennete?Math.round(base*Math.max(0,anc-1)*0.02*(anc>=2?1:0)):0;
  const gains=[["Salaire de base",base,1],["Sursalaire",r(e.sursalaire),1],["Prime d'ancienneté"+(anc?` (${anc} an${anc>1?"s":""})`:""),ancAmt,1],["Indemnité de logement",r(e.logement),1],["Indemnité de transport",r(e.transport),e.transportImp?1:0],["Autres primes fixes",r(e.primes),1],["Heures supplémentaires",r(v.hs),1],["Prime du mois",r(v.prime),1],["Absences ("+absD+" j)",-absAmt,1]].filter(g=>g[1]);
  const brut=gains.reduce((a,g)=>a+g[1],0),taxable=gains.filter(g=>g[2]).reduce((a,g)=>a+g[1],0),nonImp=brut-taxable;
  const cb=Math.min(taxable,+c.plafond||750000);const cnps=Math.round(cb*c.cnpsSal/100);
  let irpp=0;if(taxable>(+c.seuil||0)){let a=(taxable*(1-c.abat/100)-cnps)*12-(+c.abatAn||0);a=Math.max(0,a);let prev=0,t=0;for(const [mx,rt] of c.bareme){const top=mx||Infinity;if(a>prev){t+=(Math.min(a,top)-prev)*rt/100}prev=top;if(!mx)break}irpp=Math.round(t/12)}
  const cac=Math.round(irpp*c.cac/100),cfc=Math.round(taxable*c.cfcSal/100),rav=taxable>0?tbl(c.rav,taxable):0,tdl=base>0?tbl(c.tdl,base):0;
  const ret=[["CNPS pension (part salariale)",cb,c.cnpsSal,cnps],["IRPP",taxable,null,irpp],["Centimes additionnels communaux (CAC)",irpp,c.cac,cac],["Crédit foncier (CFC)",taxable,c.cfcSal,cfc],["Redevance audiovisuelle (RAV)",taxable,null,rav],["Taxe de développement local (TDL)",base,null,tdl]];
  if(e.irppExo){ret[1][3]=0;ret[2][3]=0}
  const avance=r(v.avance),retenue=r(v.retenue);
  const totRet=ret.reduce((a,x)=>a+x[3],0)+avance+retenue;
  const pat=[["CNPS pension (part patronale)",cb,c.cnpsPat],["Prestations familiales",cb,c.pf],["Accidents du travail",cb,c.at],["Fonds national de l'emploi (FNE)",taxable,c.fne],["Crédit foncier (part patronale)",taxable,c.cfcPat]].map(x=>[...x,Math.round(x[1]*x[2]/100)]);
  const totPat=pat.reduce((a,x)=>a+x[3],0);
  return{e,k,gains,brut,taxable,nonImp,ret,avance,retenue,totRet,net:brut-totRet,pat,totPat,cout:brut+totPat,anc}
}

  return{table,items,miss}}

function cfpPnl(r){const inR=t=>t>=r.from&&t<=r.to;const all=pnl(r),re=pnl(r,"resto");
  const cess=(S.cessions||[]).filter(c=>inR(c.ts)).reduce((a,c)=>a+c.amount,0);

  const dep=exp.reduce((a,e)=>a+e.amount,0);const tps=S.sales.filter(s=>LIVE(s)&&isTP(s)&&inR(s.ts));const tp=tps.reduce((a,s)=>a+tpCost(s),0);
  const caF=all.caF;const net=Math.round(all.net-re.net);return{caF,cess,exp,byCat,dep,tps,tp,net,calc:Math.round(caF+cess-dep-tp),all,re}}
function recouv(){let due=0,paid=0;S.apprenants.filter(a=>a.statut!=="abandon").forEach(a=>{const d=a.plan.filter(e=>e.d<day(Date.now())+864e5).reduce((s,e)=>s+e.a,0);due+=d;paid+=Math.min(appPaid(a),d)});return{due,paid,rate:due?paid/due:1}}
function attrib(r){/* recettes et charges par promotion (id de session, "" = commun) */
  const inR=t=>t>=r.from&&t<=r.to;const R={};const g=k=>R[k||""]=R[k||""]||{rec:0,dep:0,tp:0};
  S.payF.forEach(x=>{const a=S.apprenants.find(y=>y.id===x.app);const k=a?a.sess:"";if(inR(x.ts))g(k).rec+=x.amount;if(x.void&&inR(x.void.ts))g(k).rec-=x.amount});
  S.expenses.filter(e=>e.sec==="cfp"&&inR(e.ts)).forEach(e=>{if(e.split){let left=e.amount;const ks=Object.keys(e.split);ks.forEach((k,i)=>{const v=i===ks.length-1?left:Math.round(e.split[k]);left-=v;g(k).dep+=v})}else g(e.sess).dep+=e.amount});
  S.sales.filter(s=>LIVE(s)&&isTP(s)&&inR(s.ts)).forEach(s=>g(s.tp&&s.tp.sess).tp+=tpCost(s));
  (S.cessions||[]).filter(c=>inR(c.ts)).forEach(c=>g(c.sess).rec+=c.amount);return R}

    <label class="f">Début<input id="scH1" type="time" value="08:00" required></label><label class="f">Fin<input id="scH2" type="time" value="12:00" required></label>
    <label class="f">Module / matière<input id="scM" required placeholder="Ex. Pâtisserie de base" list="scMods"><datalist id="scMods">${[...new Set(S.formations.flatMap(f=>(f.modules||[]).map(m=>m.nom)))].map(m=>`<option value="${esc(m)}">`).join("")}</datalist></label><label class="f">Formateur<select id="scF">${fmtrOpts("","—")}</select></label>
    <label class="f">Type<select id="scT"><option value="cours">Cours</option><option value="tp">Travaux pratiques</option></select></label><label class="f">Salle<input id="scSa" placeholder="Facultatif"></label>
    <label class="f">Répéter chaque semaine<select id="scR">${[0,1,3,7,11,15].map(n=>`<option value="${n}">${n?`Oui, ${n+1} semaines au total`:"Non"}</option>`).join("")}</select></label>
    <div class="row full"><button class="btn primary">Enregistrer</button><button type="button" class="btn ghost" data-c-scancel>Annuler</button></div></div></form>`:""}
  ${wd.map((n,i)=>{const dd=mon+i*864e5;const X=L.filter(x=>isoD(x.date)===isoD(dd)).sort((a,b)=>a.h1.localeCompare(b.h1));if(!X.length&&i>4)return"";
    return `<div class="panel"><h3 style="margin:0 0 6px">${n} ${new Date(dd).toLocaleDateString("fr-FR",{day:"2-digit",month:"long"})}${isoD(dd)===isoD(b)?' <span class="pill info">Aujourd\'hui</span>':""}</h3>${X.length?`<div class="flist">${X.map(x=>seanceRow(x,true)).join("")}</div>`:`<small class="muted">Pas de séance</small>`}</div>`}).join("")}${fs?progPanel(fs):`<div class="panel muted">Choisissez une promotion pour voir l'avancement de son programme et le cahier de texte.</div>`}`}

/* --- présences --- */
function absOf(a){let A=0,R=0,h=0;S.seances.forEach(x=>{const v=x.abs&&x.abs[a.id];if(v==="A"){A++;h+=hrs(x)}if(v==="R")R++});return{A,R,h}}
function vFpres(){const lst=S.seances.filter(x=>x.date<=Date.now()+864e5&&x.date>=Date.now()-30*864e5).sort((a,b)=>b.date-a.date||b.h1.localeCompare(a.h1));
  let id=ui.fpresId;if(!lst.some(x=>x.id===id))id=(lst.find(x=>isoD(x.date)===isoD(Date.now()))||lst[0]||{}).id;const x=S.seances.find(y=>y.id===id);

  const L=sessApps(x.sess).filter(a=>a.statut!=="diplome");const ab=x.abs||{};const s=sessById(x.sess);
  return head+`<div class="panel"><label class="f">Séance<select id="cfPres">${lst.map(y=>`<option value="${y.id}" ${y.id===x.id?"selected":""}>${fmtD(y.date)} ${esc(y.h1)} · ${esc(y.module)} · ${esc(sessById(y.sess)?.nom||"")}</option>`).join("")}</select></label></div>
  <div class="panel"><h3>${esc(x.module)} · ${fmtD(x.date)} ${esc(x.h1)}–${esc(x.h2)}</h3><p class="muted" style="margin:0 0 8px">${esc(s?.nom||"")} · ${L.length} apprenant(s) · présents ${L.filter(a=>!ab[a.id]).length}, absents ${L.filter(a=>ab[a.id]==="A").length}, retards ${L.filter(a=>ab[a.id]==="R").length}</p>
  ${L.length?`<div class="flist">${L.map(a=>{const v=ab[a.id]||"P";const ph=a.telTuteur||a.tel;return `<div class="fi"><div class="fh"><b>${esc(appName(a))}</b><span class="row" style="gap:4px;flex-wrap:nowrap">${[["P","Présent"],["R","Retard"],["A","Absent"]].map(([k,l])=>`<button class="btn sm ${v===k?"primary":"ghost"}" ${v===k&&k==="A"?'style="background:var(--bad);border-color:var(--bad)"':""} data-c-mark="${x.id}|${a.id}|${k}" aria-pressed="${v===k}">${l}</button>`).join("")}</span></div>
    ${v==="R"&&ph?`<div>${waBtn(ph,lateTxt(a,x),"Prévenir le parent du retard")}</div>`:""}${v==="A"&&ph?`<div>${waBtn(ph,`Bonjour${a.tuteur?" "+a.tuteur:""}, ${S.settings.name} vous informe que ${appName(a)} était absent(e) au cours « ${x.module} » du ${fmtD(x.date)} (${x.h1}–${x.h2}). Merci de nous contacter au ${S.settings.phone||""}.`,"Prévenir le parent")}</div>`:""}</div>`}).join("")}</div>`:`<div class="empty">Aucun apprenant dans cette promotion.</div>`}
  <div class="row" style="margin-top:10px;gap:6px"><button class="btn" data-c-scan="${x.id}">Pointer avec les cartes (QR)</button><button class="btn primary" data-c-mark="${x.id}|*|P">${x.abs?"Appel enregistré · tout le monde présent":"Valider : tout le monde présent"}</button></div></div>
  <div class="panel"><h3>Absences de la promotion</h3><div class="scroll"><table><thead><tr><th>Apprenant</th><th class="r">Absences</th><th class="r">Heures</th><th class="r">Retards</th></tr></thead><tbody>${L.map(a=>{const o=absOf(a);return `<tr><td>${esc(appName(a))}</td><td class="r num">${o.A}</td><td class="r num">${fmtH(o.h)}</td><td class="r num">${o.R}</td></tr>`}).join("")}</tbody></table></div></div>`}

/* --- notes et bulletins --- */
function moyennes(sid){const E=S.evals.filter(e=>e.sess===sid);const L=sessApps(sid).concat(S.apprenants.filter(a=>a.sess===sid&&a.statut==="abandon"&&false));const res={};
  L.forEach(a=>{const mods={};let sn=0,sc=0;E.forEach(e=>{const v=e.notes&&e.notes[a.id];if(v===""||v==null||isNaN(+v))return;const n=+v*20/(+e.sur||20),c=+e.coef||1;sn+=n*c;sc+=c;const m=mods[e.module]=mods[e.module]||{sn:0,sc:0};m.sn+=n*c;m.sc+=c});
    res[a.id]={gen:sc?sn/sc:null,mods:Object.fromEntries(Object.entries(mods).map(([k,m])=>[k,{avg:m.sn/m.sc,coef:m.sc}]))}});
  const rk=Object.entries(res).filter(([,o])=>o.gen!=null).sort((x,y)=>y[1].gen-x[1].gen);rk.forEach(([id],i)=>res[id].rang=i+1);Object.values(res).forEach(o=>o.n=rk.length);return res}
function vFnotes(){const sid=ui.fsess&&sessById(ui.fsess)?ui.fsess:(S.sessions[0]||{}).id;const head=page("Notes et bulletins","Évaluations par promotion, moyennes, rangs, bulletins et attestations en PDF.");
  if(!sid)return head+`<div class="panel empty">Créez d'abord une promotion (Filières et promotions).</div>`;
  const E=S.evals.filter(e=>e.sess===sid).sort((a,b)=>a.date-b.date);const L=sessApps(sid);const M=moyennes(sid);const ev=S.evals.find(e=>e.id===ui.fev);
  return head+`<div class="panel"><label class="f">Promotion<select id="cfSess">${sessOpts(sid)}</select></label></div>
  ${ev?`<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Notes · ${esc(ev.module)} · ${fmtD(ev.date)} (sur ${ev.sur}, coef. ${ev.coef})</h3><button class="btn sm primary" data-c-fev="">Terminé</button></div>
    <div class="scroll"><table><tbody>${L.map(a=>`<tr><td>${esc(appName(a))}</td><td style="width:110px"><input data-c-note="${ev.id}|${a.id}" inputmode="decimal" value="${ev.notes&&ev.notes[a.id]!=null?esc(ev.notes[a.id]):""}" placeholder="—" aria-label="Note de ${esc(appName(a))}"></td></tr>`).join("")}</tbody></table></div><small class="muted">Laissez vide si l'apprenant n'a pas composé. Les notes sont enregistrées dès que vous changez de case.</small></div>`:""}
  <form class="panel" id="evalForm"><h3>Nouvelle évaluation</h3><div class="form"><label class="f">Module / matière<input id="evM" required placeholder="Ex. Hygiène et sécurité" list="evMods"><datalist id="evMods">${[...new Set(S.evals.map(e=>e.module))].map(m=>`<option value="${esc(m)}">`).join("")}</datalist></label>
    <label class="f">Date<input id="evD" type="date" value="${isoD(Date.now())}"></label><label class="f">Noté sur<input id="evS" inputmode="numeric" value="20"></label><label class="f">Coefficient<input id="evC" inputmode="decimal" value="1"></label>
    <div class="row full"><button class="btn primary">Créer et saisir les notes</button></div></div></form>
  <div class="panel"><h3>Évaluations (${E.length})</h3>${E.length?`<div class="flist">${E.map(e=>{const nb=Object.values(e.notes||{}).filter(v=>v!==""&&v!=null).length;return `<div class="fi"><div class="fh"><b>${esc(e.module)}</b><span class="muted num">${fmtD(e.date)}</span></div><small class="muted">Sur ${e.sur} · coef. ${e.coef} · ${nb}/${L.length} note(s)</small><div class="row" style="gap:6px"><button class="btn sm" data-c-fev="${e.id}">Saisir les notes</button><button class="btn sm ghost" data-c-evdel="${e.id}">Supprimer</button></div></div>`}).join("")}</div>`:`<div class="empty">Aucune évaluation pour cette promotion.</div>`}</div>
  <div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Moyennes et bulletins</h3>${L.length?`<button class="btn sm" data-c-bulall="${sid}">Tous les bulletins (PDF)</button>`:""}</div>
    <div class="scroll"><table><thead><tr><th>Rang</th><th>Apprenant</th><th class="r">Moyenne</th><th>Mention</th><th class="r">Absences</th><th></th></tr></thead><tbody>
    ${L.slice().sort((x,y)=>(M[x.id].rang||999)-(M[y.id].rang||999)).map(a=>{const o=M[a.id];return `<tr><td class="num">${o.rang||"—"}</td><td>${esc(appName(a))}</td><td class="r num"><b>${o.gen!=null?n20(o.gen).toLocaleString("fr-FR"):"—"}</b></td><td>${o.gen!=null?mention(o.gen):""}</td><td class="r num">${absOf(a).A}</td>
      <td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-c-bul="${a.id}">Bulletin</button><button class="btn sm ghost" data-c-att="${a.id}">Attestation</button></td></tr>`}).join("")||`<tr><td colspan="6" class="empty">Aucun apprenant.</td></tr>`}</tbody></table></div></div>`}

    <label class="f full" style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="seVd" ${ev.done?"checked":""}> Stage terminé (l'apprenant repasse « En formation »)</label>

  <div class="panel">${L.length?`<div class="flist">${L.map(s=>{const a=S.apprenants.find(y=>y.id===s.app);return `<div class="fi"><div class="fh"><b>${esc(appName(a))}</b>${s.done?`<span class="pill ok">Terminé${s.note!=null&&s.note!==""?" · "+s.note+"/20":""}</span>`:`<span class="pill info">En cours</span>`}</div>
    <small class="muted">${esc(s.ent)}${s.tuteur?" · tuteur "+esc(s.tuteur):""}${s.tel?" ("+esc(s.tel)+")":""} · ${s.debut?fmtD(dIso(s.debut)):""}${s.fin?" → "+fmtD(dIso(s.fin)):""}</small>${s.appr?`<small>${esc(s.appr)}</small>`:""}
    ${ok?`<div class="row" style="gap:6px"><button class="btn sm" data-c-steval="${s.id}">Évaluer</button><button class="btn sm ghost" data-c-conv="${s.id}">Convention PDF</button><button class="btn sm ghost" data-c-attst="${s.id}">Attestation de stage</button>${s.tel?waBtn(s.tel,`Bonjour ${s.tuteur||""}, ${S.settings.name} : nous prenons des nouvelles du stage de ${appName(a)}. Merci de nous dire comment il/elle s'en sort.`,"WhatsApp tuteur"):""}<button class="btn sm ghost" data-c-stdel="${s.id}">Supprimer</button></div>`:""}</div>`}).join("")}</div>`:`<div class="empty">Aucun stage enregistré.</div>`}</div>`}

/* --- travaux pratiques et cessions --- */

  const C=(S.cessions||[]).filter(c=>inR(c.ts)).sort((a,b)=>b.ts-a.ts);const ct=C.reduce((a,c)=>a+c.amount,0);

  ${L.map(s=>`<tr><td class="num">${dt(s.ts)}</td><td>${esc(sessById(s.tp?.sess)?.nom||"—")}<br><small class="muted">${esc(fmtr(s.tp?.formateur)?.nom||"")}</small></td><td>${s.tp?.theme?`<b>${esc(s.tp.theme)}</b><br>`:""}<small>${esc(s.items.map(i=>i.qty+" "+i.name).join(", "))}</small></td><td class="r num">${fmt(tpCost(s))}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">Aucun TP sur la période.</td></tr>`}</tbody></table></div></div>
  ${can("cfp_dep")||can("admin")?`<form class="panel" id="cessForm"><h3>Plats ou produits de TP cédés au restaurant</h3><p class="muted" style="margin:0 0 8px">Si le restaurant reprend des plats préparés en TP pour les vendre, enregistrez ici leur valeur (au coût de revient). C'est une recette pour le centre et une charge pour le restaurant ; le résultat de la société ne change pas.</p><div class="form">

  ${C.length?`<div class="panel"><h3>Cessions de la période</h3><div class="flist">${C.map(c=>`<div class="fi"><div class="fh"><span>${esc(c.label)}</span><b class="num">${fmt(c.amount)}</b></div><small class="muted">${fmtD(c.ts)}${c.sess?" · "+esc(sessById(c.sess)?.nom||""):""} ${can("admin")?`· <button class="btn sm ghost" data-c-cesdel="${c.id}">Supprimer</button>`:""}</small></div>`).join("")}</div></div>`:""}`}

/* --- caisse du centre --- */
function cfpCash(from,to){const inR=t=>t>from&&t<=to;const M={};FPAYS.forEach(k=>M[k]={in:0,out:0});const g=k=>M[k]=M[k]||{in:0,out:0};
  S.payF.forEach(x=>{if(inR(x.ts))g(x.pay).in+=x.amount;if(x.void&&inR(x.void.ts))g(x.pay).in-=x.amount});
  S.expenses.filter(e=>e.sec==="cfp"&&inR(e.ts)).forEach(e=>g(e.pay).out+=e.amount);
  const last=S.cfpClos[S.cfpClos.length-1];const fond=last?last.fondLeft:(+S.settings.cfpFloat||0);return{from,to,M,fond,attendu:fond+M["Espèces"].in-M["Espèces"].out}}
function vFcaisse(){const last=S.cfpClos[S.cfpClos.length-1];const c=cfpCash(last?last.to:0,Date.now());
  return `${page("Caisse du centre",`Depuis ${last?"la clôture du "+dt(last.to):"le début"} · caisse séparée de celle du restaurant`)}
  <div class="kpis"><div class="kpi hl"><span class="eyebrow">Espèces attendues</span><span class="v num">${fmt(c.attendu)}</span><span class="s">fond ${fmt(c.fond)} + reçus ${fmt(c.M["Espèces"].in)} − dépenses ${fmt(c.M["Espèces"].out)}</span></div>
    ${FPAYS.filter(k=>k!=="Espèces").map(k=>`<div class="kpi"><span class="eyebrow">${k}</span><span class="v num">${fmt(c.M[k].in-c.M[k].out)}</span><span class="s">entrées ${fmt(c.M[k].in)} · sorties ${fmt(c.M[k].out)}</span></div>`).join("")}</div>
  ${can("cfp_caisse")?`<form class="panel" id="cfpClosForm"><h3>Clôturer la caisse du centre</h3><div class="form">
    <label class="f">Espèces comptées<input id="ccC" inputmode="numeric" required></label><label class="f">Fond laissé en caisse<input id="ccF" inputmode="numeric" value="${c.fond||0}"></label><label class="f full">Observation<input id="ccO" placeholder="Facultatif"></label>
    <div class="row full"><button class="btn primary">Clôturer</button></div></div></form>`:""}
  <div class="panel"><h3>Clôtures précédentes</h3>${S.cfpClos.length?`<div class="scroll"><table><thead><tr><th>Date</th><th class="r">Attendu</th><th class="r">Compté</th><th class="r">Écart</th><th>Par</th><th></th></tr></thead><tbody>
    ${S.cfpClos.slice().reverse().map(k=>`<tr><td class="num">${dt(k.to)}</td><td class="r num">${fmt(k.attendu)}</td><td class="r num">${fmt(k.compte)}</td><td class="r">${ecartPill(k.ecart)}</td><td>${esc(staffName(k.by))}</td><td>${waBtn("",`${S.settings.name} – clôture caisse centre de formation du ${dt(k.to)}\nAttendu : ${fmt(k.attendu)}\nCompté : ${fmt(k.compte)}\nÉcart : ${fmt(k.ecart)}\nFond laissé : ${fmt(k.fondLeft)}${k.obs?"\n"+k.obs:""}`,"Envoyer")}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Aucune clôture.</div>`}</div>`}

function pdfQr(doc,text,x,y,size){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),c=size/n;doc.setFillColor(255,255,255);doc.rect(x-1,y-1,size+2,size+2,"F");doc.setFillColor(0,0,0);for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))doc.rect(x+k*c,y+r*c,c+.02,c+.02,"F")}
function drawCard(doc,x,y,a){const W=85.6,H=54;doc.setDrawColor(200);doc.setLineWidth(.2);doc.roundedRect(x,y,W,H,3,3);doc.setFillColor(21,29,87);doc.roundedRect(x,y,W,12,3,3,"F");doc.rect(x,y+8,W,4,"F");doc.setFillColor(234,127,92);doc.rect(x,y+12,W,1,"F");
  const LG=logos();LG.slice(0,1).forEach(l=>{try{doc.addImage(l,"JPEG",x+2,y+1.5,9,9)}catch(e){}});doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.text(doc.splitTextToSize(S.settings.name,W-16)[0],x+13,y+5.5);doc.setFont("helvetica","normal");doc.setFontSize(6);doc.text("CARTE D'APPRENANT",x+13,y+9.5);doc.setTextColor(0);

/* --- échéances à venir et prévisions --- */
function fAvenir(){const T=today0();const L=[];S.apprenants.filter(a=>a.statut!=="abandon").forEach(a=>appSched(a).forEach(e=>{if(e.reste>0&&e.d>=T&&e.d<T+8*864e5)L.push({a,e})}));L.sort((x,y)=>x.e.d-y.e.d);
  return `<div class="panel"><h3>Échéances des 7 prochains jours · ${fmt(L.reduce((s,x)=>s+x.e.reste,0))}</h3><p class="muted" style="margin:0 0 8px">Prévenez avant le retard : un message suffit souvent.</p>${L.length?`<div class="flist">${L.map(({a,e})=>{const ph=a.telTuteur||a.tel;return `<div class="fi"><div class="fh"><b>${esc(appName(a))}</b><b class="num">${fmt(e.reste)}</b></div><small class="muted">${esc(e.l)} · le ${fmtD(e.d)} · ${esc(sessName(a))}</small>
    <div class="row" style="gap:6px">${can("formation")?`<button class="btn sm" data-fpay="${a.id}">Encaisser</button>`:""}${ph?waBtn(ph,`Bonjour${a.tuteur?" "+a.tuteur:""}, ${S.settings.name} vous rappelle que ${fmt(e.reste)} (${e.l}) pour ${appName(a)} sont à régler le ${fmtD(e.d)}. Paiement au centre ou par Orange Money / MTN MoMo. Merci.`,"Rappel WhatsApp"):""}</div></div>`}).join("")}</div>`:`<div class="empty">Aucune échéance dans les 7 prochains jours.</div>`}</div>`}
function cfpForecast(n){const T=today0();const out=[{k:"Retards (déjà échus)",v:0}];const now=new Date(T);for(let i=0;i<n;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);out.push({k:d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}),y:d.getFullYear(),m:d.getMonth(),v:0})}
  S.apprenants.filter(a=>a.statut!=="abandon").forEach(a=>appSched(a).forEach(e=>{if(e.reste<=0)return;if(e.d<T){out[0].v+=e.reste;return}const d=new Date(e.d);const o=out.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(o)o.v+=e.reste}));return out}
function fPrev(){const F=cfpForecast(6);const mx=Math.max(1,...F.map(x=>x.v));
  return `<div class="panel"><h3>Prévision des encaissements</h3><p class="muted" style="margin:0 0 8px">Ce qui reste à encaisser selon les échéanciers des apprenants (hors abandons).</p><div class="flist">${F.map(x=>`<div class="fi"><div class="fh"><span style="text-transform:capitalize">${esc(x.k)}</span><b class="num">${fmt(x.v)}</b></div><div style="height:8px;border-radius:6px;background:var(--sunk)"><div style="height:8px;border-radius:6px;width:${Math.round(x.v*100/mx)}%;background:${x.k.startsWith("Retard")?"var(--bad)":"var(--accent)"}"></div></div></div>`).join("")}</div></div>`}

/* --- statistiques annuelles --- */
function cfpStats(y){const R=yearR(y);const inY=t=>t>=R.from&&t<=R.to;const age=a=>{if(!a.naiss)return null;const b=new Date(a.naiss);let n=y-b.getFullYear();return n};
  const ins=S.apprenants.filter(a=>inY(a.dateInscr));const dip=S.apprenants.filter(a=>a.statut==="diplome"&&inY(a.statTs||sessOf(a)?.fin||0));const ab=S.apprenants.filter(a=>a.statut==="abandon"&&inY(a.statTs||0));
  const AG=[["Moins de 18 ans",0,17],["18 à 25 ans",18,25],["26 à 35 ans",26,35],["Plus de 35 ans",36,200]];
  const rows=S.formations.map(f=>{const I=ins.filter(a=>a.formation===f.id);return[f.nom,I.length,I.filter(a=>a.sexe==="F").length,I.filter(a=>a.sexe==="M").length,dip.filter(a=>a.formation===f.id).length,ab.filter(a=>a.formation===f.id).length]});
  const ages=AG.map(([l,a,b])=>[l,ins.filter(x=>{const n=age(x);return n!=null&&n>=a&&n<=b}).length]);ages.push(["Âge non renseigné",ins.filter(x=>age(x)==null).length]);
  let adm=0,pres=0;S.exams.filter(x=>x.date&&inY(dIso(x.date))).forEach(x=>Object.values(x.cand||{}).forEach(c=>{if(c.in===false)return;if(c.res&&c.res!=="absent")pres++;if(c.res==="admis")adm++}));
  return{y,rows,ages,ins:ins.length,dip:dip.length,ab:ab.length,adm,pres}}
function statsPanel(){const y=ui.sy||new Date().getFullYear();const s=cfpStats(y);
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Statistiques de l'année ${y}</h3><span class="row" style="gap:4px"><button class="btn sm ghost" data-c-sy="${y-1}">${y-1}</button>${y<new Date().getFullYear()?`<button class="btn sm ghost" data-c-sy="${y+1}">${y+1}</button>`:""}</span></div>
  <p class="muted" style="margin:6px 0 8px">Utile pour les rapports à l'administration (MINEFOP, mairie…) : inscrits de l'année par filière, sexe et âge, diplômés, abandons, examens.</p>
  <div class="scroll"><table><thead><tr><th>Filière</th><th class="r">Inscrits</th><th class="r">Femmes</th><th class="r">Hommes</th><th class="r">Diplômés</th><th class="r">Abandons</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1).map(v=>`<td class="r num">${v}</td>`).join("")}</tr>`).join("")}
  <tr><td><b>Total</b></td>${[1,2,3,4,5].map(i=>`<td class="r num"><b>${s.rows.reduce((a,r)=>a+r[i],0)}</b></td>`).join("")}</tr></tbody></table></div>
  <div class="scroll" style="margin-top:8px"><table><tbody>${s.ages.map(([l,n])=>`<tr><td>${l}</td><td class="r num">${n}</td></tr>`).join("")}<tr><td>Examens : admis / présents</td><td class="r num">${s.adm} / ${s.pres}${s.pres?` (${Math.round(s.adm*100/s.pres)} %)`:""}</td></tr></tbody></table></div></div>`}

/* --- pointage par QR --- */
async function scanStart(sid){const x=S.seances.find(y=>y.id===sid);if(!x)return;const L=sessApps(x.sess);if(!x.abs||!Object.keys(x.abs).length){x.abs={};L.forEach(a=>x.abs[a.id]="A");x.fait=true;save()}
  ui.scan={sid};const m=$("#modal");m.innerHTML=`<form class="panel" id="scanForm" style="width:min(460px,100%);display:grid;gap:10px"><h3 style="margin:0">Pointage par carte · ${esc(x.module)}</h3><p class="muted" style="margin:0" id="scInfo">Présentez le QR code de chaque carte devant la caméra. Tout le monde est marqué absent au départ.</p>
  <video id="scV" playsinline muted style="width:100%;max-height:260px;border-radius:12px;background:#000"></video><div class="row" style="gap:6px;flex-wrap:nowrap"><input id="scM" placeholder="ou tapez le matricule (CFP-2026-001)" autocapitalize="characters" style="flex:1;min-width:0"><button class="btn">Pointer</button></div>
  <div id="scList" class="muted"></div><button type="button" class="btn primary" data-c-scanstop>Terminer l'appel</button></form>`;m.hidden=false;scanList();
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){$("#scInfo").textContent="La caméra ne peut pas lire les QR codes sur ce navigateur : tapez le matricule de chaque apprenant présent (ou utilisez Chrome sur Android).";$("#scV").hidden=true;return}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});ui.scan.stream=st;const v=$("#scV");v.srcObject=st;await v.play();const det=new BarcodeDetector({formats:["qr_code"]});
    ui.scan.timer=setInterval(async()=>{if($("#modal").hidden){scanStop();return}try{(await det.detect(v)).forEach(c=>scanHit(c.rawValue))}catch(e){}},400)}catch(e){$("#scInfo").textContent="Caméra refusée ou indisponible : tapez les matricules.";$("#scV").hidden=true}}
function scanList(){const x=S.seances.find(y=>y.id===ui.scan?.sid);const el=$("#scList");if(!x||!el)return;const L=sessApps(x.sess);const p=L.filter(a=>!x.abs[a.id]);el.innerHTML=`<b>${p.length} présent(s) sur ${L.length}</b>${p.length?" : "+p.map(a=>esc(appName(a))).join(", "):""}`}
function scanHit(raw){const x=S.seances.find(y=>y.id===ui.scan?.sid);if(!x)return;const mat=String(raw||"").split("|")[0].trim().toUpperCase();const a=S.apprenants.find(y=>(y.matricule||"").toUpperCase()===mat);
  if(!a){toast("Carte inconnue : "+mat);return}if(a.sess!==x.sess){toast(appName(a)+" n'est pas dans cette promotion");return}if(!x.abs[a.id])return;delete x.abs[a.id];save();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}toast("Présent : "+appName(a));scanList()}
function scanStop(){const s=ui.scan;if(!s)return;clearInterval(s.timer);try{s.stream&&s.stream.getTracks().forEach(t=>t.stop())}catch(e){}ui.scan=null;$("#modal").hidden=true;render()}

  if(loud)toast(SY.lastOk?(changed?"Synchronisé : données des autres téléphones reçues":"Synchronisé"):"Synchronisation impossible : "+SY.msg);

/* ================= COFFRE CHIFFRÉ (données protégées sur l'appareil) ================= */
const VLT={env:null,dek:null,q:Promise.resolve(),busy:false};
const vOk=()=>!!(window.crypto&&crypto.subtle&&window.TextEncoder);
const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function vKek(pw,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function vWrap(login,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const raw=await crypto.subtle.exportKey("raw",VLT.dek);const k=await vKek(pw,salt);return{login,salt:b64(salt),iv:b64(iv),wk:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,raw))}}
async function vUnwrap(e,pw){const k=await vKek(pw,unb64(e.salt));const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(e.iv)},k,unb64(e.wk));return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},true,["encrypt","decrypt"])}
async function vEnc(txt){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},VLT.dek,new TextEncoder().encode(txt)))}}
async function vDec(o){return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.iv)},VLT.dek,unb64(o.ct)))}
const vPub=()=>({name:S.settings.name,short:S.settings.short||"",city:S.settings.city||"",logo:S.settings.logo||"",logo2:S.settings.logo2||""});
function vaultWrite(){const snap=JSON.stringify(S);let meta=null;try{if(SY.metaDirty){meta=SY.metaRaw;SY.metaDirty=false}}catch(e){}VLT.q=VLT.q.then(async()=>{const c=await vEnc(snap);VLT.env.iv=c.iv;VLT.env.ct=c.ct;VLT.env.pub=vPub();VLT.env.ts=Date.now();const raw=JSON.stringify(VLT.env);
    const mraw=meta?JSON.stringify({enc:1,...(await vEnc(meta))}):null;if(IDB.db)await (mraw?IDB.setMany({state:raw,sync:mraw}):IDB.set("state",raw));else{localStorage.setItem(KEY,raw);if(mraw)localStorage.setItem("rc-sync",mraw)}}).catch(e=>toast("Enregistrement chiffré impossible : "+(e&&e.message||e)))}
async function vaultRemember(login,pw){if(!VLT.env||!VLT.dek||!login||!pw)return;try{const e=await vWrap(String(login).toLowerCase(),pw);VLT.env.keys=(VLT.env.keys||[]).filter(k=>k.login!==e.login).concat(e);vaultWrite()}catch(e){}}
function vaultForget(login){if(!VLT.env)return;VLT.env.keys=(VLT.env.keys||[]).filter(k=>k.login!==String(login).toLowerCase());vaultWrite()}
function vaultBoot(env){VLT.env=env;ui.vaultLocked=true;const p=env.pub||{};Object.assign(S.settings,{name:p.name||S.settings.name,short:p.short||"",city:p.city||"",logo:p.logo||S.settings.logo,logo2:p.logo2||S.settings.logo2});ui.session=false}
async function vaultOpen(entry,secret){VLT.dek=await vUnwrap(entry,secret);const txt=await vDec(VLT.env);S=JSON.parse(txt);migrate();ui.vaultLocked=false;ui.vaultJust=true;
  try{await syncLoadMeta();syncStart()}catch(e){}}
async function vaultUnlock(id,pw,say){if(VLT.busy)return;const e=(VLT.env.keys||[]).find(k=>k.login===id);
  if(!e){say(`« ${id} » n'a pas encore accès aux données protégées de ce téléphone. Le gérant doit d'abord se connecter ; ensuite, connectez-vous une fois avec « Changer d'utilisateur ».`);return}
  VLT.busy=true;const el=$("#lgErr");if(el){el.textContent="Ouverture des données protégées…";el.style.background="rgba(255,255,255,.18)"}

  VLT.busy=false;if(el)el.style.background="";doLogin()}
async function vaultEnable(pw){const u=me();if(!vOk()){toast("Ce navigateur ne sait pas chiffrer");return}if(!u||!pwOk(u.pw,u,pw)){toast("Mot de passe incorrect");return}

/* ================= ANIMATIONS (légères, coupées si « réduire les animations ») ================= */
const RM=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
const EASE="cubic-bezier(.16,1,.3,1)";
const anim=(el,kf,o)=>{if(!el||RM()||!el.animate)return;try{el.animate(kf,{duration:240,easing:EASE,...o})}catch(e){}};
function countUp(root){if(RM())return;root.querySelectorAll(".kpi .v").forEach(el=>{const txt=el.textContent;const m=txt.match(/^(\D*?)(-?\d[\d\s  ]*)(.*)$/);if(!m)return;
  const end=parseInt(m[2].replace(/\D/g,""),10)*(m[2].trim().startsWith("-")?-1:1);if(!isFinite(end)||Math.abs(end)<10)return;
  const f=n=>Math.round(n).toLocaleString("fr-FR").replace(/ | /g," ");const t0=performance.now(),D=650;
  const step=t=>{if(!document.body.contains(el))return;const k=Math.min(1,(t-t0)/D);const e=1-Math.pow(1-k,3);el.textContent=m[1]+f(end*e)+m[3];if(k<1)requestAnimationFrame(step);else el.textContent=txt};
  requestAnimationFrame(step)})}
const cssEsc=v=>window.CSS&&CSS.escape?CSS.escape(v):String(v).replace(/["\\]/g,"\\$&");
const tapSel=b=>{const a=[...b.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${cssEsc(x.value)}"]`).join("");return a?"button"+a:null};

{const R0=render;let lastV=null,lastQ=-1,lastT=null;

{const watch=(el,fn)=>{if(!el)return;let was=el.hidden;new MutationObserver(()=>{if(was&&!el.hidden)fn(el);was=el.hidden}).observe(el,{attributes:true,attributeFilter:["hidden"]})};

/* ================= CHARGEMENT LÉGER (application installée) =================
   La version en ligne charge d'abord la caisse, puis en arrière-plan les photos du catalogue,
   l'outil PDF et l'outil Excel (fichiers séparés, gardés ensuite sur le téléphone). */
window.__bpLoaded=()=>{try{S.photos=S.photos||{};S.bpDone=S.bpDone||[];let ch=0;ch+=bpForce();Object.keys(BP).forEach(k=>{if(!S.bpDone.includes(k)){if(!S.photos[k]){S.photos[k]=BP[k];ch++}S.bpDone.push(k)}});if(ch)save();if(ui.session&&$("#modal").hidden)render()}catch(e){}};
const LIBS={done:!window.__LAZY,p:null};
function loadLibs(){if(LIBS.done)return Promise.resolve();if(LIBS.p)return LIBS.p;
  const one=src=>new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error(src));document.head.appendChild(s)});
  LIBS.p=(async()=>{/* les fichiers portent le numéro de version (?v=) : un téléphone ne garde jamais d'anciennes photos */for(const f of window.__LAZY){if(/^jspdf\.js/.test(f)&&window.jspdf)continue;if(/^xlsx\.js/.test(f)&&window.XLSX)continue;let n=0;for(;;){try{await one(f);break}catch(e){if(++n>=3)throw e;await new Promise(r=>setTimeout(r,4000))}}}LIBS.done=true})().catch(e=>{LIBS.p=null;throw e});return LIBS.p}
if(window.__LAZY){const kick=()=>setTimeout(()=>loadLibs().catch(()=>{}),800);if(document.readyState==="complete")kick();else addEventListener("load",kick);
  /* un bouton qui fabrique un PDF ou un fichier Excel attend que l'outil soit chargé */
  const NEED=/pdf|print|export|xls|xl$|recu|share|bulletin|attest|card|releve|certif|conv|fiche|regl|payslip|imprim|dl|c-act|doc|ticket/i;
  document.addEventListener("click",e=>{if(LIBS.done)return;const b=e.target.closest&&e.target.closest("button,a");if(!b)return;
    if(![...b.attributes].some(a=>a.name.startsWith("data-")&&NEED.test(a.name.slice(5))))return;
    e.preventDefault();e.stopPropagation();toast("Préparation de l'outil PDF / Excel… (première fois seulement)");

/* ================= MOTS DE PASSE : SHA-256 répété (format « s2$ ») ================= */
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){const l=bytes.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(bytes);m[l]=0x80;const bl=l*8;m[nb-4]=bl>>>24&255;m[nb-3]=bl>>>16&255;m[nb-2]=bl>>>8&255;m[nb-1]=bl&255;
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),W=new Uint32Array(64);
  for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)W[i]=m[o+4*i]<<24|m[o+4*i+1]<<16|m[o+4*i+2]<<8|m[o+4*i+3];
    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=((a>>>7|a<<25)^(a>>>18|a<<14)^a>>>3)+W[i-7]+((b>>>17|b<<15)^(b>>>19|b<<13)^b>>>10)+W[i-16]|0}
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){const t1=h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+(e&f^~e&g)+SHA_K[i]+W[i]|0,t2=((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+(a&b^a&c^b&c)|0;h=g;g=f;f=e;e=d+t1|0;d=c;c=b;b=a;a=t1+t2|0}
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
  const out=new Uint8Array(32);for(let i=0;i<8;i++){out[4*i]=H[i]>>>24;out[4*i+1]=H[i]>>>16&255;out[4*i+2]=H[i]>>>8&255;out[4*i+3]=H[i]&255}return out}
const PW_ITER=30000;
/* empreinte lente : 30 000 tours de SHA-256, sel = identifiant interne du compte */
const utf8=s=>window.TextEncoder?new TextEncoder().encode(s):Uint8Array.from(unescape(encodeURIComponent(s)),c=>c.charCodeAt(0));
function pwS2(u,p){let h=sha256(utf8("yont|"+(u&&u.id)+"|"+p));for(let i=1;i<PW_ITER;i++)h=sha256(h);return "s2$"+[...h].map(x=>x.toString(16).padStart(2,"0")).join("")}
const pwOk=(h,u,p)=>!!h&&(String(h).startsWith("s2$")?h===pwS2(u,p):h===pwHashOld(u,p));

  try{for(const it of S.mailq.slice()){try{const r=await supaRpc("yont_report",{id:it.id,subject:it.subject,body:it.body});

/* ================= RAPPORTS DE CLÔTURE DÉPOSÉS SUR LE SERVEUR (lus par le gérant) ================= */
const REP={list:null,at:0,first:true};
const repSeenKey=()=>"yont_rep_seen_"+(S.user||"");
const repSeen=()=>{try{return +localStorage.getItem(repSeenKey())||0}catch(e){return 0}};
const repUnread=()=>(REP.list||[]).filter(r=>new Date(r.ts).getTime()>repSeen()).length;
async function repLoad(force){let ok=false;try{ok=can("admin")&&cloudOn()&&isSupa(cloud().url)&&STANDALONE&&navigator.onLine!==false}catch(e){}if(!ok)return;
  if(!force&&Date.now()-REP.at<25000)return;REP.at=Date.now();
  try{const j=await supaRpc("yont_reports",{n:20});if(!j.ok)return;const before=new Set((REP.list||[]).map(r=>r.id));REP.list=j.rapports||[];
    const fresh=REP.list.filter(r=>!before.has(r.id)&&new Date(r.ts).getTime()>repSeen());
    if(!REP.first&&fresh.length){const t="Nouveau rapport de clôture : "+fresh[0].sujet;toast(t);try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}
      try{if(window.Notification&&Notification.permission==="granted")new Notification("YONT Caisse",{body:t,icon:"icon-192.png",tag:"rep-"+fresh[0].id})}catch(e){}}
    REP.first=false;if(ui.session&&$("#modal").hidden&&(ui.view==="direct"||fresh.length))render()}catch(e){}}
setInterval(()=>{try{repLoad()}catch(e){}},60000);
function repPanel(){let sup=false;try{sup=cloudOn()&&isSupa(cloud().url)}catch(e){}
  if(!sup)return `<div class="panel"><h3>Rapports de clôture</h3><div class="empty">Branchez le serveur YONT (Paramètres → Serveur en ligne) pour recevoir ici le rapport de chaque clôture, depuis n'importe quel poste.</div></div>`;
  if(!STANDALONE)return `<div class="panel"><h3>Rapports de clôture</h3><div class="empty">Visibles dans l'application installée (l'application Claude bloque internet).</div></div>`;
  if(!REP.list||Date.now()-REP.at>8000)setTimeout(()=>repLoad(true),0);const seen=repSeen();
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Rapports de clôture${repUnread()?` <span class="pill bad">${repUnread()} nouveau(x)</span>`:""}</h3><button class="btn ghost sm" data-rep-reload>Actualiser</button></div>
    ${!REP.list?`<p class="muted">Chargement…</p>`:REP.list.length?`<div style="display:grid;gap:6px;margin-top:8px">${REP.list.map(r=>`<button class="dlink" data-rep-open="${esc(r.id)}" style="margin:0;width:100%;${new Date(r.ts).getTime()>seen?"font-weight:700":""}"><span class="ib">${ic("report")}</span><span style="text-align:left">${esc(r.sujet)}<br><small class="muted">reçu le ${dt(new Date(r.ts).getTime())}</small></span>${ic("chev","ic chev")}</button>`).join("")}</div>`:`<div class="empty">Aucun rapport pour l'instant : il arrive ici dès qu'une caisse est clôturée.</div>`}</div>`}
function repOpen(id){const r=(REP.list||[]).find(x=>x.id===id);if(!r)return;try{localStorage.setItem(repSeenKey(),String(Math.max(repSeen(),new Date(r.ts).getTime())))}catch(e){}
  const m=$("#modal");m.innerHTML=`<div class="panel" style="width:min(560px,100%);display:grid;gap:10px"><h3 style="margin:0">${esc(r.sujet)}</h3><pre style="white-space:pre-wrap;background:var(--sunk);padding:12px;border-radius:10px;margin:0;font-size:.85rem;max-height:60vh;overflow:auto">${esc(r.texte)}</pre>
  <div class="row" style="gap:6px;flex-wrap:wrap"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(r.sujet+"\n\n"+r.texte)}">Envoyer par WhatsApp</a><button class="btn" data-rep-copy>Copier</button><button class="btn ghost" data-close>Fermer</button></div></div>`;m.hidden=false;ui.repTxt=r.sujet+"\n\n"+r.texte}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.repOpen){repOpen(d.repOpen);render()}else if("repReload" in d){repLoad(true)}});

/* ================= COMMANDES DU MENU QR REÇUES DIRECTEMENT À LA CAISSE ================= */
const QR={list:[],known:new Set(),open:{}};
const qrOn=()=>{try{return cloudOn()&&isSupa(cloud().url)&&STANDALONE&&ui.session&&canView("vente")&&S.settings.menuDirect!==false}catch(e){return false}};
function qrDing(){try{const A=window.AudioContext||window.webkitAudioContext;const c=qrDing.c||(qrDing.c=new A());[0,.22,.44].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.18);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function qrPoll(){if(!qrOn()||qrPoll.busy||navigator.onLine===false||document.visibilityState==="hidden"){if(!qrOn()){QR.list=[];qrDraw()}return}qrPoll.busy=true;
  try{const out=S.products.filter(p=>stockOf(p)<=0).map(p=>p.name).sort();const key=JSON.stringify(out);
    if(key!==QR.sentOut||Date.now()-(QR.sentAt||0)>300000){const r=await supaRpc("yont_qr_staff",{op:"stock",out});if(r.ok){QR.sentOut=key;QR.sentAt=Date.now()}}}catch(e){}
  try{const j=await supaRpc("yont_qr_staff",{op:"list"});if(j.ok){const L=j.commandes||[];const fresh=L.filter(o=>!QR.known.has(o.id));L.forEach(o=>QR.known.add(o.id));QR.list=L;
      if(fresh.length){qrDing();toast(`Nouvelle commande client : ${fresh[0].table}`);try{if(window.Notification&&Notification.permission==="granted"&&document.visibilityState!=="visible")new Notification("Commande client · "+fresh[0].table,{body:qrTxt(fresh[0]),icon:"icon-192.png",tag:"qr-"+fresh[0].id})}catch(e){}}
      qrDraw()}}catch(e){}finally{qrPoll.busy=false}}
setInterval(()=>{try{qrPoll()}catch(e){}},5000);
const qrTxt=o=>o.items.map(i=>`${i.q} × ${i.n}`).join(", ");
const qrProd=n=>{const k=String(n||"").trim().toLowerCase();return S.products.find(p=>p.type!=="kit"?p.name.toLowerCase()===k:p.name.toLowerCase()===k)||S.products.find(p=>p.name.toLowerCase()===k)};
function qrDraw(){let b=$("#qrBox");if(!QR.list.length||!ui.session){if(b)b.hidden=true;return}
  if(!b){b=document.createElement("div");b.id="qrBox";b.setAttribute("role","region");b.setAttribute("aria-label","Commandes des clients");document.body.appendChild(b)}b.hidden=false;
  b.innerHTML=`<div class="qrh"><b>${ic("bell","ic sm")} Commandes des clients (${QR.list.length})</b><button class="btn ghost sm" data-qr-min aria-label="Réduire">${QR.min?"Ouvrir":"Réduire"}</button></div>${QR.min?"":QR.list.map(o=>`<div class="qri">
    <div><b>${esc(o.table)}</b> · <small class="muted">${new Date(o.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}${o.name?" · "+esc(o.name):""}</small><br>${o.items.map(i=>`${esc(i.q)} × ${esc(i.n)}${qrProd(i.n)?"":` <span class="pill warn">inconnu</span>`}`).join("<br>")}${o.note?`<br><i>« ${esc(o.note)} »</i>`:""}</div>
    ${QR.open[o.id]?`<div class="row" style="gap:6px;flex-wrap:wrap">${["Article épuisé","Commande en double","Mauvaise table","Commande non sérieuse"].map(m=>`<button class="btn sm ghost" data-qr-no="${esc(o.id)}" data-motif="${esc(m)}">${esc(m)}</button>`).join("")}<button class="btn sm ghost" data-qr-back="${esc(o.id)}">Retour</button></div>`
      :`<div class="row" style="gap:6px"><button class="btn primary sm" data-qr-ok="${esc(o.id)}">Accepter</button><button class="btn ghost sm" data-qr-ask="${esc(o.id)}">Refuser</button></div>`}</div>`).join("")}`}
async function qrDecide(id,ok,motif){const o=QR.list.find(x=>x.id===id);if(!o)return;if(!can("vente")){toast("Réservé au personnel de vente");return}
  let r;try{r=await supaRpc("yont_qr_staff",{op:"decide",id,ok,motif:motif||"",dev:devName()})}catch(e){toast("Pas de connexion : réessayez");return}
  QR.list=QR.list.filter(x=>x.id!==id);delete QR.open[id];qrDraw();
  if(!r.ok||!r.fait){toast("Commande déjà traitée sur un autre poste");return}
  if(!ok){log(`Commande client refusée (${o.table}) : ${motif}`);save();toast("Commande refusée : le client est prévenu");return}
  const t=tableList().includes(o.table)?o.table:"Comptoir";const ord=orderOf(t);const miss=[],skip=[];
  o.items.forEach(i=>{const p=qrProd(i.n);if(!p){miss.push(i.n);return}const it={pid:p.id,qty:+i.q||1};const m=needOrder(ord,it);
    if(Object.entries(m).some(([k,v])=>v>(prod(k)?.stock||0))){skip.push(p.name);return}const l=ord.find(x=>x.pid===p.id&&!x.off);l?l.qty+=it.qty:ord.push({pid:p.id,qty:it.qty})});
  const kt=kitchenPush(t,ord,S.user);log(`Commande client acceptée : ${t} · ${qrTxt(o)}${o.name?" · "+o.name:""}`);save();
  if(ui.view==="vente"){ui.table=t}render();
  toast(`Commande ajoutée à ${t}${kt?" et envoyée en cuisine":""}`+(skip.length?` · stock insuffisant : ${skip.join(", ")}`:"")+(miss.length?` · introuvable : ${miss.join(", ")}`:""))}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("#qrBox button");if(!b)return;const d=b.dataset;
  if(d.qrOk)qrDecide(d.qrOk,true);else if(d.qrAsk){QR.open[d.qrAsk]=1;qrDraw()}else if(d.qrBack){delete QR.open[d.qrBack];qrDraw()}
  else if(d.qrNo)qrDecide(d.qrNo,false,d.motif);else if("qrMin" in d){QR.min=!QR.min;qrDraw()}});
async function qrSetupMenu(){/* prépare la clé publique du menu sur le serveur ; renvoie les réglages à mettre dans le menu */
  let ok=false;try{ok=cloudOn()&&isSupa(cloud().url)&&S.settings.menuDirect!==false}catch(e){}if(!ok)return null;
  if(!S.settings.menuKey){const a=new Uint8Array(12);crypto.getRandomValues(a);S.settings.menuKey=[...a].map(x=>x.toString(16).padStart(2,"0")).join("");save()}
  try{const r=await supaRpc("yont_qr_staff",{op:"setup",mk:S.settings.menuKey});if(!r.ok)throw new Error(r.erreur||"refusé")}catch(e){toast("Commandes directes non activées (serveur injoignable) : ce menu enverra par WhatsApp");return null}
  return{url:normGas(cloud().url),pk:SUPA_PK,mk:S.settings.menuKey}}

/* ================= IMPRESSION AUTOMATIQUE DES BONS DE CUISINE ================= */
/* moment : "servi" (la serveuse touche Servi) ou "envoi" (commande envoyée) ; appareil d'impression : celui relié à l'imprimante */
const KPK="yont_kprinted",KBOOT=Date.now();
const kAt=()=>S.settings.kPrintAt||"servi";
function kPrinted(){try{return JSON.parse(localStorage.getItem(KPK)||"[]")}catch(e){return ui.kpr||(ui.kpr=[])}}
function kMark(x){try{const a=kPrinted();a.push(x);localStorage.setItem(KPK,JSON.stringify(a.slice(-400)))}catch(e){(ui.kpr=ui.kpr||[]).push(x)}}
const kDev=()=>{const id=S.settings.kPrintDev;return id&&devList().some(x=>x.id===id)?id:""};
const kHere=()=>{const id=kDev();return !id||(thisPost()&&thisPost().id===id)};
function kAuto(k,ev){if(!k||!S.settings.kitchenPrint||kAt()!==ev||!kHere())return;const key=k.id+"|"+ev;if(kPrinted().includes(key))return;kMark(key);setTimeout(()=>printKitchen(k.id),300)}
/* l'appareil d'impression imprime les bons envoyés ou servis depuis les autres téléphones (reçus par la synchronisation) */
function kWatch(){try{if(ui.vaultLocked||!S.settings.kitchenPrint||!kDev()||!kHere())return;const ev=kAt();const now=Date.now();const done=kPrinted();
  const k=(S.kitchen||[]).find(x=>{const t=ev==="servi"?x.serviTs:x.ts;return t&&(ev!=="servi"||x.status==="servi")&&t>KBOOT-120000&&t>now-30*60000&&!done.includes(x.id+"|"+ev)});
  if(k){kMark(k.id+"|"+ev);printKitchen(k.id)}}catch(e){}}
setInterval(kWatch,3000);
function kitchenText(k){const W=(+S.settings.ticketW||80)>60?42:32;const ctr=t=>{t=String(t);return t.length>=W?t:" ".repeat(Math.floor((W-t.length)/2))+t};const sep="-".repeat(W);const hm=t=>dt(t,{hour:"2-digit",minute:"2-digit"});
  const L=[ctr("BON DE CUISINE N° "+k.no),k.status==="servi"?ctr("*** SERVI ***"):"",sep,"Table   : "+k.table,"Serveur : "+staffName(k.staff),"Commande: "+hm(k.ts),k.serviTs&&k.status==="servi"?"Servi   : "+hm(k.serviTs)+(k.servedBy?" par "+staffName(k.servedBy):""):"",sep,...k.items.map(i=>`${i.qty} x ${i.name}`),sep,ctr(S.settings.name),"",""];
  return L.filter(x=>x!=="").join("\n")+"\n\n\n"}

/* ================= SAUVEGARDES SERVEUR : CHOIX DE LA DATE ET ALERTE ================= */
/* le serveur sauvegarde chaque nuit (30 dernières + une par mois pendant un an + une par an) */
const BKI={at:0,last:null,modif:null,busy:false};
const bkSupa=()=>{try{return cloudOn()&&isSupa(cloud().url)}catch(e){return false}};
async function bkInfo(force){if(!bkSupa()||BKI.busy||!can("admin"))return;if(!force&&Date.now()-BKI.at<30*6e4)return;BKI.busy=true;
  try{const j=await supaRpc("yont_backup",{op:"liste"});if(j&&j.ok){BKI.last=j.derniere?new Date(j.derniere).getTime():0;BKI.modif=j.modif?new Date(j.modif).getTime():0;BKI.at=Date.now()}}catch(e){}
  BKI.busy=false;bkAlert()}
/* alerte : des modifications existent mais aucune sauvegarde depuis plus de 48 h */
function bkLate(){if(BKI.last==null)return 0;const ref=BKI.last||0;if(BKI.modif&&BKI.modif<=ref)return 0;const h=(Date.now()-ref)/36e5;return h>=48?h:0}
function bkAlert(){const a=$("#app");if(!a||ui.view!=="direct"||!can("admin")||$("#bkWarn"))return;const h=bkLate();if(!h)return;
  const d=document.createElement("div");d.id="bkWarn";d.className="notice gold";d.style.cssText="margin-bottom:12px;align-items:center";
  d.innerHTML=`${ic("alert")}<span style="flex:1"><b>Aucune sauvegarde ${BKI.last?`depuis ${Math.floor(h/24)} jours`:"sur le serveur"}.</b> La sauvegarde automatique de la nuit n'a pas fonctionné : prévenez le développeur.</span><button type="button" class="btn sm" data-cloud-now>Sauvegarder maintenant</button>`;
  a.insertBefore(d,a.firstChild)}

      <b style="margin-top:6px">Dernières sauvegardes (30 au plus)</b>${(j.fichiers||[]).map(x=>row(x,lab(x))).join("")||'<p class="muted" style="margin:0">Aucune</p>'}
      ${(j.mois||[]).length?`<b style="margin-top:6px">Une par mois (gardées un an)</b>${j.mois.map(x=>row(x,(t=>t.charAt(0).toUpperCase()+t.slice(1))(new Date(x.date).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})))).join("")}`:""}

  catch(e){toast("Liste impossible : "+(e.message||"connexion"))}}

function byTake(by,q,first){const out={};let r=q;const take=id=>{const v=Math.min(by[id]||0,r);if(v>0){by[id]-=v;out[id]=(out[id]||0)+v;r-=v;if(by[id]<=0)delete by[id]}};

const IGS_DEF=[[500000,20000],[1000000,30000],[1500000,40000],[2000000,50000],[2500000,60000],[5000000,150000],[10000000,300000],[20000000,500000],[30000000,1000000],[50000000,2000000]];
const igsCfg=()=>S.settings.igsCfg||(S.settings.igsCfg={seuil:50000000,bareme:IGS_DEF.map(x=>[...x]),prev:{}});
const igsOf=ca=>{const B=igsCfg().bareme;const r=B.find(([p])=>ca<=p);return r?r[1]:null};
const yearR=y=>({from:new Date(y,0,1).getTime(),to:new Date(y,11,31,23,59,59).getTime()});
const caHT=r=>pnl(r).sig.XB;
function igsYear(y){const c=igsCfg();const now=new Date();const R=yearR(y);const ca=caHT({from:R.from,to:Math.min(R.to,Date.now())});
  const el=y<now.getFullYear()?365:y>now.getFullYear()?0:Math.max(1,Math.round((Date.now()-R.from)/864e5));const proj=el?Math.round(ca*365/el):0;
  const base=c.prev[y]!=null&&c.prev[y]!==""?+c.prev[y]:(y<now.getFullYear()?ca:proj);const annual=igsOf(base);
  const T=[0,1,2,3].map(q=>{const f=new Date(y,q*3,1).getTime(),t=new Date(y,q*3+3,0,23,59,59).getTime();const key=`${y}-T${q+1}`;const paid=S.expenses.filter(e=>e.igs===key).reduce((a,e)=>a+e.amount,0);
    return{q:q+1,key,from:f,to:t,ca:caHT({from:f,to:Math.min(t,Date.now())}),due:annual==null?0:Math.round(annual/4),deadline:new Date(y,q*3+3,15,23,59).getTime(),paid}});
  return{y,ca,proj,base,annual,T,seuil:c.seuil,usingPrev:c.prev[y]!=null&&c.prev[y]!==""}}

  if(I.proj>=I.seuil*.9)out.push(["alert","var(--bad-soft)","var(--bad)",I.proj>=I.seuil?"Seuil IGS dépassé (projection)":"Seuil IGS bientôt atteint",`Chiffre d'affaires projeté ${fmt(I.proj)} pour un seuil de ${fmt(I.seuil)} : préparez le passage au régime du réel.`,"fiscal"]);
